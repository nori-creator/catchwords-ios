# The app's server (server/ → Supabase Edge Function `native-fn`).
#
# Every push and PR that touches it: typecheck, unit tests and the bundle build.
# Pushes to main (and a manual run) then deploy the function to the app's Supabase project.
#
# The deploy needs one repository secret, SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# It never appears in the code or in the logs; without it the deploy step stops with a message.
# The AI keys are not here: they live in the function's own secrets on Supabase.
name: Server（サーバ）

on:
  push:
    paths: ["server/**", "supabase/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "supabase/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: native-fn-bundle
          path: supabase/functions/native-fn/bundle.js
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: libwmvpoqvxfxbjgqnuj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-fn-bundle
          path: supabase/functions/native-fn
      - name: Access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy native-fn
        run: supabase functions deploy native-fn --project-ref "$PROJECT_REF" --use-api
