# ホームの写真から単語の頁を開く速さ（2026-10-31 オーナー: 「ホームの画像をタップしてから、単語の詳細が表示されるまでの
# ラグがある」）。押してから頁が出るまでの秒数（WORDOPEN）と、アプリの記録（遅れた描画・word page asked / appeared）を
# 成果物 word-open-report に入れる。開いた時の画面の写真も入る（切り抜き・場所・単語・意味が一度に見えるか）。
name: iOS word open（ホームから単語の頁を開く）
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-open:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iphone]
    steps:
      - uses: actions/checkout@v4
      - name: シミュレーターを選んで起動する
        run: |
          UDID=$(xcrun simctl list devices available -j | DEVICE=${{ matrix.device }} python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)["devices"]
          kind = os.environ["DEVICE"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              if kind == "ipad":
                  found = [x for x in d[rt] if x["name"].startswith("iPad Pro 11")] or [x for x in d[rt] if x["name"].startswith("iPad Pro")]
              else:
                  found = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
                  found = found or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if found:
                  print(found[-1]["udid"]); print(rt, found[-1]["name"], file=sys.stderr); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: ホームの写真から単語の頁を開く
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project CatchWords.xcodeproj -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$(cat "$RUNNER_TEMP/udid")" \
            -only-testing:CatchWordsUITests/WordOpenTests \
            -resultBundlePath "$RUNNER_TEMP/word.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/word.log" | grep -E 'error:|Test Case|WORDOPEN|TEST (SUCCEEDED|FAILED)'
      - name: 記録を取り出す
        if: always()
        run: |
          OUT="$RUNNER_TEMP/word-report"
          mkdir -p "$OUT"
          DATA=$(xcrun simctl get_app_container "$(cat "$RUNNER_TEMP/udid")" com.nori.catchwords data 2>/dev/null) \
            && cp "$DATA/Library/Caches/uitest-trace.txt" "$OUT/trace.txt" 2>/dev/null || echo "no app trace"
          if [ -f "$OUT/trace.txt" ]; then
            # The taps, the page asked for and on screen, and the frames delivered late around them.
            grep -E "word page|frames |main thread|touch .*(began|ended)" "$OUT/trace.txt" | tail -400 || true
            # What the main thread was doing while it did not answer (sampled every 2 s): what holds the page up.
            echo "---- main thread stacks ----"
            grep -E "word page|main stack|^    " "$OUT/trace.txt" | head -1500 || true
          fi
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/word.xcresult" --output-path "$OUT" || true
          find "$OUT" -name "*.mp4" -delete 2>/dev/null || true
          cp "$RUNNER_TEMP/word.log" "$OUT/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-open-report-${{ matrix.device }}
          path: ${{ runner.temp }}/word-report
