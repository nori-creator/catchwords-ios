# iOS 版と Web 版の「約束」の確認（scripts/check_native_contract.py）
#
# iOS 版が呼ぶサーバの関数（NativeAPI.call("…")）が、Web 版の「iOS から呼んでよい関数の名簿」
# （src/lib/native-fn.ts の NATIVE_FNS）に載っていて、Web のコードにまだ在るかを確かめる。
# Web 版で消したり名前を変えたりすると、iOS 版のボタンが黙って何もしなくなるので、赤にして知らせる。
# あわせて、iOS の表示言語（ios/Localization/languages.json）が全部、Web のサーバが解説を書ける言語
# （src/lib/explain-languages.ts）に同じ順で入っているかも確かめる。
#
# - iOS 版を変えた時（push / PR）
# - 毎日 1 回（Web 版だけが変わった時に気づくため。失敗すると GitHub からメールが届く）
# - 手で（Actions → このワークフロー → Run workflow。Web の別のブランチも指定できる）
name: iOS ↔ Web contract（約束の確認）

on:
  push:
  pull_request:
  schedule:
    - cron: "17 0 * * *"   # 毎日 09:17（日本時間）
  workflow_dispatch:
    inputs:
      web_ref:
        description: "確かめる Web 版のブランチ"
        required: false
        default: "main"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: iOS 版が呼ぶ関数が Web 版に全部あるか
        run: python3 scripts/check_native_contract.py --ref "${{ inputs.web_ref || 'main' }}"
