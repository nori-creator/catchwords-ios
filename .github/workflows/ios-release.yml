# iOS 版を App Store Connect（TestFlight）へ送る — Rork も Mac も使わない
#
# 使い方（手順の全体は docs/self-managing-ios.md）:
#   GitHub → Actions → 「iOS release（App Store Connect へ送る）」→ Run workflow
#   約 15〜25 分で App Store Connect の TestFlight に新しいビルドが届く。
#   そこから TestFlight で配る／審査に出す、は App Store Connect の画面で行う。
#
# 事前に GitHub の Settings → Secrets and variables → Actions に入れておく 4 つ:
#   APPLE_TEAM_ID        … Apple Developer のチーム ID（10 桁の英数字）
#   ASC_KEY_ID           … App Store Connect API キーの「キー ID」
#   ASC_ISSUER_ID        … 同じ画面の「Issuer ID」
#   ASC_KEY_P8           … ダウンロードした AuthKey_XXXX.p8 をメモ帳などで開いた中身をそのまま貼る
#                          （「-----BEGIN PRIVATE KEY-----」から「-----END PRIVATE KEY-----」まで全部）
#                          ※ 以前の ASC_KEY_P8_BASE64（base64 にした文字列）でも動く
#
# 署名（証明書・プロファイル）は Apple のクラウド署名に任せる
# （-allowProvisioningUpdates + API キー）。手元に証明書を持たなくてよい。
# 自動署名のアーカイブは一度「開発用」で署名し、送る時に配布用で署名し直す。開発用の
# プロファイルを作るため、Apple Developer に端末が1台以上登録されている必要がある
# （無いと「Your team has no devices」で止まる。手順書の「端末を1台登録する」）。
# その開発用の証明書は実行ごとに 1 枚増えるので、scripts/asc_dev_certs.py で前の実行の残りと
# この実行で増えた分を消す（API キーで作られたものだけ）。API キーの役割は Admin にすること
# （Admin でないと証明書を消せず、配布用の証明書も毎回増えることがある）。
name: iOS release（App Store Connect へ送る）

on:
  workflow_dispatch:
    inputs:
      build_offset:
        description: "ビルド番号の下駄（Rork で送ったビルドより大きくするため）。通常はそのまま"
        required: false
        default: "1000"
      revoke_old_dev_certs:
        description: "開発用証明書を、人が Mac で作ったものも含めてすべて消してから始める（通常は不要。自動の後片付けでも「証明書の上限」で止まった時だけ選ぶ。配布用には触らない）"
        type: boolean
        required: false
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    # iPhone Duo の内側の画面を全面で使うには iOS 27.1 SDK で組み立てる（オーナー 2026-10-28「iphone duo用に完全対応させて」。
    # 古い SDK では内側で「見慣れた大きさの枠」の中に出るだけ）。xcode-27 の画像の既定は Xcode 27.1（27A9275、Apple が
    # 2026-10-15 に出した正式版）。ios-check の release-build も同じ画像で Release を組み立てて確かめている。
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 必要な設定がそろっているか確かめる
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$ASC_KEY_P8" ] || [ -n "$ASC_KEY_P8_BASE64" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets が足りません:$missing（docs/self-managing-ios.md の手順 3）"
            exit 1
          fi

      - name: API キーを一時ファイルに置く
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::ASC_KEY_P8 の中身が .p8 の形ではありません（BEGIN PRIVATE KEY から END PRIVATE KEY まで全部貼ってください）"; exit 1; }

      - name: Xcode の版を表示
        run: xcodebuild -version

      # 自動署名は毎回まっさらな Mac で「開発用」証明書を 1 枚作る。数えておき、最後に消す
      # （消さないと Apple の上限に達してアーカイブが止まる）。
      - name: 開発用証明書を数え、前の実行の残りを消す
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REVOKE_OLD: ${{ inputs.revoke_old_dev_certs }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [ "$REVOKE_OLD" = "true" ]; then
            python3 scripts/asc_dev_certs.py delete-all
          else
            python3 scripts/asc_dev_certs.py delete-ci
          fi
          python3 scripts/asc_dev_certs.py snapshot "$RUNNER_TEMP/dev-certs-before.txt"

      - name: アーカイブ（App Store 用に組み立てて署名する）
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_OFFSET: ${{ inputs.build_offset }}
        run: |
          set -o pipefail
          # Rork など別の道具から送ったビルドより必ず大きくする（同じ番号は App Store Connect が断る）。
          BUILD_NUMBER=$(ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 ../scripts/asc_next_build.py com.nori.catchwords $(( ${BUILD_OFFSET:-1000} + GITHUB_RUN_NUMBER )))
          echo "build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project CatchWords.xcodeproj \
            -scheme CatchWords \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CatchWords.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|Signing Identity|Provisioning Profile" || true
          if grep -q "has no devices" "$RUNNER_TEMP/archive.log"; then
            # 端末が1台も登録されていないと、開発用の署名ができない。署名せずにアーカイブし、
            # 送る時（exportArchive）に配布用で署名させる。
            echo "::warning::端末が登録されていないので、署名せずにアーカイブして、送る時に配布用で署名します"
            rm -rf "$RUNNER_TEMP/CatchWords.xcarchive"
            xcodebuild archive \
              -project CatchWords.xcodeproj \
              -scheme CatchWords \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/CatchWords.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          fi
          if grep -qiE "app groups|application-groups|com.nori.catchwords.widgets" "$RUNNER_TEMP/archive.log" && grep -q "error:" "$RUNNER_TEMP/archive.log" \
            && ! grep -q "maximum number of certificates" "$RUNNER_TEMP/archive.log"; then
            echo "::warning::ウィジェット（com.nori.catchwords.widgets）か App Group（group.com.nori.catchwords）の署名で止まった可能性があります。Apple Developer → Identifiers で App Group を作り、2 つの App ID で App Groups を有効にしてから、もう一度実行してください"
          fi
          if [ ! -d "$RUNNER_TEMP/CatchWords.xcarchive" ]; then
            # 失敗の行そのものを注釈に出す（Actions の画面の一覧と API の両方から読めるように）。
            grep -E "error:|Provisioning|provisioning|entitlement|agreement|Agreement" "$RUNNER_TEMP/archive.log" | sort -u | head -8 \
              | while IFS= read -r line; do echo "::error title=archive.log::${line:0:900}"; done
            if grep -q "maximum number of certificates" "$RUNNER_TEMP/archive.log"; then
              echo "::error::Apple の「開発用」証明書が上限です（前の実行の残りを消しても足りませんでした）。Run workflow の画面で「開発用証明書を…すべて消してから始める」にチェックを入れて、もう一度実行してください"
            fi
            echo "::error::アーカイブに失敗しました（archive.log を見てください）"
            exit 1
          fi

      - name: App Store Connect へ送る
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          ARCHIVE="$RUNNER_TEMP/CatchWords.xcarchive"
          # altool は API キーを決まった場所から読む。途中で止まっても消す
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"' EXIT
          : > "$RUNNER_TEMP/upload.log"
          # Rork など別の所から同じころにビルドが送られると、アーカイブの時に決めた番号を先に使われる
          # （App Store Connect が「Redundant Binary Upload」で断る。2026-10-11 の実行 #23）。その時は
          # 次の空いている番号に書き換え、配布用の署名からやり直して送る（3 回まで）。
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/export"
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|upload" || true
            grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log" || { echo "::error::配布用の署名に失敗しました（export.log を見てください）"; exit 1; }
            IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
            echo "ipa: $IPA"
            # 配布用で署名されたか・Apple でサインインの権限が残っているかを記録に出す
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
            APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)
            codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
            codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.plist" | grep -A3 "applesignin" || echo "::warning::Apple でサインインの権限が入っていません（この版では「Appleでサインイン」が使えません。メールでのログインは使えます）"
            # ウィジェット（CatchWordsWidgets.appex）も配布用で署名され、App Group が入っているか。
            # App Group（group.com.nori.catchwords）を自動で登録できなかった場合は、アプリは動くが
            # ウィジェットが空のまま（「写真を撮って単語を集めよう」）になる。直し方: Apple Developer →
            # Identifiers → App Groups に group.com.nori.catchwords を作り、com.nori.catchwords と
            # com.nori.catchwords.widgets の両方で App Groups を有効にしてその group を選ぶ。
            grep -q "group.com.nori.catchwords" "$RUNNER_TEMP/entitlements.plist" || echo "::warning::アプリに App Group（group.com.nori.catchwords）が入っていません。ウィジェットに単語・復習の数が出ません（Apple Developer で App Group を登録して有効にしてください）"
            APP_VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null)
            APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist" 2>/dev/null)
            APPEX="$APP/PlugIns/CatchWordsWidgets.appex"
            if [ -d "$APPEX" ]; then
              codesign -dvv "$APPEX" 2>&1 | grep -E "Identifier=|Authority=Apple Distribution|TeamIdentifier" || true
              codesign -d --entitlements :- "$APPEX" 2>/dev/null > "$RUNNER_TEMP/widget-entitlements.plist" || true
              grep -q "group.com.nori.catchwords" "$RUNNER_TEMP/widget-entitlements.plist" || echo "::warning::ウィジェットに App Group（group.com.nori.catchwords）が入っていません。ウィジェットが空のまま表示されます（Apple Developer で com.nori.catchwords.widgets にも App Group を有効にしてください）"
              EXT_VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APPEX/Info.plist" 2>/dev/null)
              EXT_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APPEX/Info.plist" 2>/dev/null)
              echo "app $APP_VER ($APP_BUILD) / widgets $EXT_VER ($EXT_BUILD)"
              [ "$APP_VER" = "$EXT_VER" ] && [ "$APP_BUILD" = "$EXT_BUILD" ] || echo "::warning::アプリとウィジェットの版・ビルド番号が違います（project.pbxproj の MARKETING_VERSION を両方のターゲットでそろえてください）"
            else
              echo "::warning::IPA にウィジェット（CatchWordsWidgets.appex）が入っていません"
            fi
            # 失敗しても止めずに、記録の中身で次を決める（altool は失敗すると 0 以外で終わる）
            xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload-try.log" || true
            cat "$RUNNER_TEMP/upload-try.log" >> "$RUNNER_TEMP/upload.log"
            if grep -qiE "No errors uploading|UPLOAD SUCCEEDED" "$RUNNER_TEMP/upload-try.log"; then
              echo "::notice::App Store Connect に送りました（ビルド $APP_VER ($APP_BUILD)）。処理が終わると TestFlight に表示されます（10〜30 分）。"
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qiE "Redundant Binary Upload|bundle version must be higher" "$RUNNER_TEMP/upload-try.log"; then
              NEXT=$(ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/asc_next_build.py com.nori.catchwords $(( ${APP_BUILD:-0} + 1 )))
              echo "::warning::ビルド番号 $APP_BUILD は、同じころに別の所（Rork など）から送られたビルドが先に使っていました。$NEXT に変えて送り直します"
              # アプリとウィジェットの番号を書き換える（配布用の署名は書き換えた後にやり直すので、署名は壊れない）
              for INFO in "$ARCHIVE"/Products/Applications/*.app/Info.plist "$ARCHIVE"/Products/Applications/*.app/PlugIns/*.appex/Info.plist; do
                if [ -f "$INFO" ]; then plutil -replace CFBundleVersion -string "$NEXT" "$INFO"; fi
              done
              plutil -replace ApplicationProperties.CFBundleVersion -string "$NEXT" "$ARCHIVE/Info.plist"
              continue
            fi
            echo "::error::App Store Connect への送信に失敗しました（upload.log を見てください）"
            exit 1
          done

      # Sentry（落ちた場所を「どのファイルの何行目」で見せる）には、このビルドの記号の表（dSYM）が要る。
      # 鍵（SENTRY_AUTH_TOKEN: Sentry の Settings → Auth Tokens の Organization Token）が無ければ送らない。
      # 送れなくても TestFlight への送信は済んでいるので、この段の失敗で実行を赤にしない。
      - name: Sentry に記号の表（dSYM）を送る
        if: success()
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN が無いので、Sentry に dSYM を送りませんでした（落ちた場所は行番号なしで届きます）"
            exit 0
          fi
          npx --yes @sentry/cli@3.8.0 debug-files upload --project catchwords-ios "$RUNNER_TEMP/CatchWords.xcarchive/dSYMs"

      - name: この実行で増えた開発用証明書を消す
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -f "$RUNNER_TEMP/AuthKey.p8" ] || exit 0
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/asc_dev_certs.py delete-new "$RUNNER_TEMP/dev-certs-before.txt"

      - name: API キーを消す
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: 記録を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/entitlements.plist
            ${{ runner.temp }}/widget-entitlements.plist
          if-no-files-found: ignore
          retention-days: 14
