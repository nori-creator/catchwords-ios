# 切り抜きの確認（docs/cutout-failure-modes.md）: アプリの切り抜きのコード（CatchPlan など）をそのまま Mac 用に
# 組み立て、本物の Vision で写真を切り抜く。
#   - cases.json: 本物の写真（オーナーの写真を含む）。わざと小さい・ずれた箱も含む。
#   - scenes.json: make_scenes.py が作る場面（色の分かる物を木の床・カフェ・街の写真に置いた物、2つが触れている物）。
#     物ごとに AI の箱を 8 通り（ぴったり・広い・狭い・上下左右にずれる・点が物の外）で試す（オーナー 2026-11-03
#     「何回撮ってもミスが起きないように」）。
# 物の 85% 未満しか入らない・箱の線でまっすぐ切れる・四角い・ほかの物が混ざる、のどれかがあれば失敗。
# 結果の表は job の summary、失敗した物の絵は ci-previews の runs/<ブランチ>-cutout/。
#
# 以前は ios-check の中の job だった（組み立て・撮影の 2 時間の後ろで待っていた）。切り抜きのコードを変えた時だけ走る。
name: Cut-out harness（切り抜きの確認）

on:
  push:
    branches: [main]
    paths:
      - ios/CatchWords/Models/CatchPlan.swift
      - ios/CatchWords/Models/CatchGeometry.swift
      - ios/CatchWords/Models/TagPlacement.swift
      - ios/CatchWords/Services/InstanceMasks.swift
      - scripts/cutout-harness/**
      - .github/workflows/cutout-harness.yml
  pull_request:
    paths:
      - ios/CatchWords/Models/CatchPlan.swift
      - ios/CatchWords/Models/CatchGeometry.swift
      - ios/CatchWords/Models/TagPlacement.swift
      - ios/CatchWords/Services/InstanceMasks.swift
      - scripts/cutout-harness/**
      - .github/workflows/cutout-harness.yml
  workflow_dispatch:

concurrency:
  group: cutout-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cutout-harness:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 場面を作る（make_scenes.py）
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy 2>/dev/null || python3 -m pip install --quiet pillow numpy
          python3 scripts/cutout-harness/make_scenes.py
      - name: 切り抜きの確認を組み立てる（アプリと同じファイル）
        run: |
          set -o pipefail
          swiftc -O \
            ios/CatchWords/Models/CatchPlan.swift \
            ios/CatchWords/Models/CatchGeometry.swift \
            ios/CatchWords/Models/TagPlacement.swift \
            ios/CatchWords/Services/InstanceMasks.swift \
            scripts/cutout-harness/OldCatchPlan.swift \
            scripts/cutout-harness/main.swift \
            -o "$RUNNER_TEMP/cutout-harness" 2>&1 | tee "$RUNNER_TEMP/harness-build.log" || {
              grep -E "error:" "$RUNNER_TEMP/harness-build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; exit 1; }
      - name: 本物の Vision で切り抜く
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cutout"
          sw_vers
          "$RUNNER_TEMP/cutout-harness" scripts/cutout-harness/cases.json scripts/cutout-harness/scenes.json "$RUNNER_TEMP/cutout" | tee "$RUNNER_TEMP/cutout/log.txt"
      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutout-harness
          path: ${{ runner.temp }}/cutout
          retention-days: 14
      - name: 結果を ci-previews に置く
        if: always()
        timeout-minutes: 12
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/cutout"
          [ -d "$SRC" ] || exit 0
          [ -f "$SRC/summary.md" ] && cat "$SRC/summary.md" >> "$GITHUB_STEP_SUMMARY"
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')-cutout"
          STAGE="$RUNNER_TEMP/cutout-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp "$SRC"/* "$STAGE"/ 2>/dev/null || true
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          CI_PREVIEWS_REPLACE=1 bash scripts/push_ci_previews.sh "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$DIR" "cut-out harness for $HEAD_REF @ ${{ github.sha }}" "$STAGE"/*
