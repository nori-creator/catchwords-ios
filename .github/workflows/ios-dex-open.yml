# 図鑑を単語の多いアカウントで開く確認（2026-10-18 オーナー: 図鑑タブで画面が固まる）
# デモ用サーバーに 300 語を足して（-uiDemoMany）図鑑タブを開き、スライドを回し、ホームへ戻れるかを見る。
# アプリの記録（メインスレッドが止まった時間と、そのとき何をしていたか）を成果物 dex-open-report に入れる。
name: iOS dex open（単語の多い図鑑を開く）
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dex-open:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The owner's device is an iPad (iPad16_3, iPadOS 26) running this iPhone-only app.
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - name: シミュレーターを選んで起動する
        run: |
          UDID=$(xcrun simctl list devices available -j | DEVICE=${{ matrix.device }} python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)["devices"]
          kind = os.environ["DEVICE"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              if kind == "ipad":
                  found = [x for x in d[rt] if x["name"].startswith("iPad Pro 11")] or [x for x in d[rt] if x["name"].startswith("iPad Pro")]
              else:
                  found = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
                  found = found or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if found:
                  print(found[-1]["udid"]); print(rt, found[-1]["name"], file=sys.stderr); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 300 語の図鑑を開く
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project CatchWords.xcodeproj -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$(cat "$RUNNER_TEMP/udid")" \
            -only-testing:CatchWordsUITests/DexOpenTests \
            -resultBundlePath "$RUNNER_TEMP/dex.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/dex.log" | grep -E 'error:|Test Case|DEXOPEN|TEST (SUCCEEDED|FAILED)'
      - name: 記録を取り出す
        if: always()
        run: |
          OUT="$RUNNER_TEMP/dex-report"
          mkdir -p "$OUT"
          DATA=$(xcrun simctl get_app_container "$(cat "$RUNNER_TEMP/udid")" com.nori.catchwords data 2>/dev/null) \
            && cp "$DATA/Library/Caches/uitest-trace.txt" "$OUT/trace.txt" 2>/dev/null || echo "no app trace"
          if [ -f "$OUT/trace.txt" ]; then
            grep -v "touch " "$OUT/trace.txt" | head -250
            echo "…"
            grep -v "touch " "$OUT/trace.txt" | tail -350
          fi
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/dex.xcresult" --output-path "$OUT" || true
          find "$OUT" -name "*.mp4" -delete 2>/dev/null || true
          cp "$RUNNER_TEMP/dex.log" "$OUT/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dex-open-report-${{ matrix.device }}
          path: ${{ runner.temp }}/dex-report
