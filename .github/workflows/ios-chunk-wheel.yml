name: iOS chunk wheel regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chunk-wheel:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: シミュレーターを選んで起動する
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
              phones = phones or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Open and scroll the original wheel inside WordDetailView
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project CatchWords.xcodeproj -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$(cat "$RUNNER_TEMP/udid")" \
            -only-testing:CatchWordsUITests/ChunkWheelTests \
            -resultBundlePath "$RUNNER_TEMP/chunks.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/chunks.log" | grep -E 'error:|Test Case|TEST (SUCCEEDED|FAILED)'
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/chunk-report"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/chunks.xcresult" --output-path "$RUNNER_TEMP/chunk-report" || true
          cp "$RUNNER_TEMP/chunks.log" "$RUNNER_TEMP/chunk-report/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-wheel-report
          path: ${{ runner.temp }}/chunk-report
