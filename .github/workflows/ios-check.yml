# iOS 版の確認（iPhone が無くても見られるようにする）
#
# 何をするか:
#   1. GitHub が用意する Mac の上で、iOS アプリを組み立てる（=コンパイルが通るかの確認）。
#   2. iPhone のシミュレーター（画面上で動く仮想の iPhone）で起動する。
#   3. 起動直後の画面の写真と、20 秒の動画を撮る。
#      主な画面は、大きな文字（AX2）と小さな iPhone（SE 第3世代）でも撮る（axl-* / small-*）。
#   4. 結果を「ios-check-report」という成果物（Artifacts）として保存する。
#
# 見方: GitHub のリポジトリ → Actions → 「iOS check（iOS 版の確認）」→ 最新の実行 →
#       下の Artifacts から ios-check-report をダウンロード → 中の写真・動画を開く。
#
# 限界: シミュレーターではカメラと「被写体の切り抜き（Vision）」は動かない。
#       その 2 つは TestFlight で本物の iPhone に入れて確かめる。
name: iOS check（iOS 版の確認）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 走っている確認は止めない（止めると見本画面が届かない）。待ちは最新の1つだけ残る。
concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-shoot:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 表示の言語が混ざらないか確かめる（訳のない日本語があれば失敗）
        run: |
          python3 scripts/check_l10n.py
          python3 scripts/check_server_text.py

      - name: 言語の混在の規則を、過去の事例すべてで確かめる（docs/language-rules.md）
        run: |
          swiftc -O ios/CatchWords/Utilities/LanguageRules.swift ios/CatchWords/Utilities/ChunkRules.swift ios/LanguageRules/main.swift -o "$RUNNER_TEMP/language-rules"
          "$RUNNER_TEMP/language-rules" ios/LanguageRules/cases.json

      - name: Xcode の版を表示
        run: xcodebuild -version

      - name: シミュレーターを先に起動する（組み立てと並べて、待ち時間を短くする）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
              phones = phones or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true

      - name: シミュレーター用に組み立てる
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -20; echo "::error::組み立てに失敗しました（上の error: を見てください）"; exit 1; }

      - name: 図鑑の影の SF Symbols と4択の補充語を確かめる（DexCatalogSymbolTests と QuizPoolTests と CardCatchPickTests と MeaningGlossTests と CatchScanTests と ReadingAndCategoryTests だけを走らせる）
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project CatchWords.xcodeproj \
            -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:CatchWordsTests/DexCatalogSymbolTests \
            -only-testing:CatchWordsTests/QuizPoolTests \
            -only-testing:CatchWordsTests/CardCatchPickTests \
            -only-testing:CatchWordsTests/MeaningGlossTests \
            -only-testing:CatchWordsTests/CatchScanTests \
            -only-testing:CatchWordsTests/ReadingAndCategoryTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/symbols.log" | grep -E "error:|Test Case|failed|passed|TEST (SUCCEEDED|FAILED)|BUILD FAILED" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/symbols.log" || { grep -E "error:" "$RUNNER_TEMP/symbols.log" | head -20; echo "::error::図鑑の影の SF Symbols の確認に失敗しました（上のログを見てください）"; exit 1; }

      - name: シミュレーターで起動して撮影する
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/report"
          mkdir -p "$OUT"
          # 入っている iPhone シミュレーターのうち、最も新しい iOS の「iPhone 1x Pro」系を選ぶ
          # 組み立ての前に起動を始めてある（下の「シミュレーターを先に起動する」）。ここでは待つだけ。
          UDID=$(cat "$RUNNER_TEMP/udid")
          echo "simulator: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "$BUNDLE_ID" > "$RUNNER_TEMP/bundle"
          xcrun simctl install "$UDID" "$APP"
          # アプリは画面の決まった要素が出たら Library/Caches/ui-ready/<名前> を置く（Views/UIPreview.swift の
          # UIReady）。撮る前にそれを待つので、起動が遅い・切り替わりの途中で真っ白な写真にならない。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data || echo "$RUNNER_TEMP/no-data-container")
          echo "$DATA" > "$RUNNER_TEMP/datadir"
          rm -rf "$DATA/Library/Caches/ui-ready"
          # 許可ダイアログで画面が隠れないよう、先に許可しておく
          for s in camera microphone photos location; do xcrun simctl privacy "$UDID" grant "$s" "$BUNDLE_ID" || true; done
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$OUT/launch.mp4" &
          REC=$!
          sleep 2
          # -uiDemo: the offline demo backend answers every request (never production; no stray accounts)
          START=$SECONDS
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiDemo zh-TW -uiDemoReset YES
          # 最初の本当の画面（ログインかホーム）が出るまで待つ（最大 30 秒）。3 秒の写真はそれより前には撮らない
          n=0
          while [ ! -f "$DATA/Library/Caches/ui-ready/root" ] && [ $n -lt 120 ]; do sleep 0.25; n=$((n + 1)); done
          [ -f "$DATA/Library/Caches/ui-ready/root" ] || echo "::warning::起動後の最初の画面が出るのを待ちきれませんでした"
          for t in 3 8 15; do
            while [ $(( SECONDS - START )) -lt "$t" ]; do sleep 0.5; done
            xcrun simctl io "$UDID" screenshot "$OUT/screen-${t}s.png"
          done
          sleep 5
          kill -INT $REC; wait $REC || true
          # 起動直後に落ちていないか（落ちていれば失敗にする）
          # 一覧はファイルに書いてから探す。`| grep -q` だと見つけた瞬間に grep が閉じ、launchctl が
          # SIGPIPE で終わり、pipefail のせいで「起動していない」と誤判定する（2026-10-01 に実際に起きた）。
          xcrun simctl spawn "$UDID" launchctl list > "$RUNNER_TEMP/launchctl.txt" || true
          grep -q "$BUNDLE_ID" "$RUNNER_TEMP/launchctl.txt" || { echo "::error::アプリが起動後に終了しました"; exit 1; }

      - name: 見本の画面を撮る（アニメーションはコマ送り）
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle"); DATA=$(cat "$RUNNER_TEMP/datadir")
          READY="$DATA/Library/Caches/ui-ready/preview"
          # 名前 / 画面の決まった要素が出てから待つ秒 / コマ数（撮影の間隔はおよそ 0.4〜0.6 秒）
          for spec in "tabbar 2 1" "picker 2 1" "cutout 0 12" "reward 0 14" "variants 0 10" "get 0 16" "landing 0 16" "analyzing 0 16" "scanslow 0 24" "hero 2 1" "memorial 0 10" "hero-dark 2 1" "tabbar-dark 2 1" "carousel 2 1" "detail 3 1" "detail-dark 3 1" "settings 2 1" "settings-dark 2 1" "settings-en 2 1" "settings-zh 2 1" "aisettings 2 1" "aisettings-dark 2 1" "aisettings-en 2 1" "aisettings-zh 2 1" "aistats 2 1" "aistats-en 2 1" "aistats-zh 2 1" "aicosts 2 1" "aicosts-en 2 1" "aicosts-zh 2 1" "detail-en 3 1" "detail-zh 3 1" "hero-zh 2 1" "auth 3 1" "auth-dark 3 1" "auth-en 3 1" "auth-zh 3 1" "signin 2 1" "signin-en 2 1" "onboarding-en 3 1" "onboarding-zh 3 1" "aiconsent 2 1" "aiconsent-en 2 1" "aiconsent-zh 2 1" "paywall-en 2 1" "paywall-zh 2 1" "dex-en 2 1" "dex-zh 2 1" "jadetail-en 3 1" "jadetail-zh 3 1" "endetail-ja 3 1" "endetail-zh 3 1" "quiz-en 2 1" "answer-en 2 1" "answer-zh 2 1" "jaquiz-en 2 1" "jaquiz-zh 2 1" "enanswer-ja 2 1" "enanswer-zh 2 1" "picker-en 2 1" "japicker-en 2 1" "japicker-zh 2 1" "enpicker-ja 2 1" "enpicker-zh 2 1" "done 3 1" "done-en 3 1" "done-zh 3 1" "homeload 1 1" "homeload-en 1 1" "webimg 3 1" "webimg-en 3 1" "chunks 2 1" "chunks-en 2 1" "answer 2 1"; do
            set -- $spec
            name=$1; wait_s=$2; frames=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            rm -f "$READY"
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW || { echo "::warning::$name を開けませんでした"; continue; }
            # 見本の画面の決まった要素（4択のカード・分析の画面・ネットの画像など）が出るまで待つ（最大 20 秒）
            n=0
            while [ ! -f "$READY" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
            [ -f "$READY" ] || echo "::warning::$name の画面が出るのを待ちきれませんでした"
            sleep "$wait_s"
            for i in $(seq -w 1 "$frames"); do
              xcrun simctl io "$UDID" screenshot "$OUT/${name}-${i}.png" >/dev/null 2>&1 || true
              sleep 0.4
            done
          done
          ls -la "$OUT"

      # キャッチのスキャン（v10、オーナー承認 2026-10-11）を動画で撮る。シミュレーターでは Vision の切り抜きが
      # 動かないので、見本の写真（UIPreview.swift の ScanFixtures、輪郭はアプリと同じ CatchOutlineTracer で取る）で
      # 名前が 2.4 秒後（ペンが追いつく）と 6.0 秒後（小さい光が回って待つ）の2本。ios-check-report の videos/ に入る。
      - name: キャッチのスキャン（v10）を動画で撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/videos"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          for spec in "analyzing 9" "scanslow 13"; do
            set -- $spec
            name=$1; secs=$2
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/scan-${name}.mp4" &
            REC=$!
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW >/dev/null || echo "::warning::$name を開けませんでした"
            sleep "$secs"
            kill -INT $REC; wait $REC
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          ls -la "$OUT"

      # 監査 D-04: 主な画面だけを (1) 大きな文字（アクセシビリティの「大」= AX2、アプリの上限）と
      # (2) 小さな iPhone（iPhone SE 第3世代。無ければ入っている中で一番小さい iPhone）で撮る。
      # ファイル名: axl-<画面>.png / small-<画面>.png / small-axl-<画面>.png（端末名は small-device.txt）。
      # 失敗してもこの確認全体は赤にしない（撮れなかった画面は警告だけ）。
      - name: 大きな文字と小さな iPhone で主な画面を撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          AXL="-UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL"
          # 名前 / 待つ秒: ホーム・図鑑・単語の詳細・復習の4択・設定・カメラ不許可・AI の同意
          SCENES="home:3 dex:2 detail:3 quiz:2 settings:2 camblocked:2 aiconsent:2"
          shoot() {  # shoot <udid> <ファイル名の頭> [追加の起動引数...]
            local dev=$1 prefix=$2; shift 2
            # 他の見本と同じく、画面の決まった要素が出た印（ui-ready/preview）を待ってから撮る（監査 D-10）。
            local data ready
            data=$(xcrun simctl get_app_container "$dev" "$BUNDLE_ID" data 2>/dev/null || echo "$RUNNER_TEMP/no-data-container")
            ready="$data/Library/Caches/ui-ready/preview"
            for spec in $SCENES; do
              local name=${spec%%:*} wait_s=${spec##*:} n=0
              xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
              rm -f "$ready"
              xcrun simctl launch "$dev" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW ${1+"$@"} >/dev/null || { echo "::warning::$prefix$name を開けませんでした"; continue; }
              while [ ! -f "$ready" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
              [ -f "$ready" ] || echo "::warning::$prefix$name の画面が出るのを待ちきれませんでした"
              sleep "$wait_s"
              xcrun simctl io "$dev" screenshot "$OUT/${prefix}${name}.png" >/dev/null 2>&1 || echo "::warning::$prefix$name を撮れませんでした"
            done
            xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
          }
          # (1) いつものシミュレーターで、大きな文字
          shoot "$UDID" "axl-" $AXL
          # (2) 小さな iPhone: 無ければ作る。メモリを空けるため、いつものシミュレーターは止める。
          SMALL=$(python3 - <<'PY'
          import json, re, subprocess
          def sim(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
          runtimes = [r for r in sim("runtimes")["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtimes.sort(key=lambda r: [int(x) for x in re.findall(r"\d+", r.get("version", "0"))], reverse=True)
          def rank(name):
              if name == "iPhone SE (3rd generation)": return 0
              if "SE" in name: return 1
              if "mini" in name: return 2
              if re.search(r"\d+e\b", name): return 3            # iPhone 16e
              if not re.search(r"Pro|Plus|Max|Air", name): return 4
              return 9
          devices = sim("devices", "available")["devices"]
          for rt in runtimes:
              phones = [t for t in rt.get("supportedDeviceTypes", []) if t.get("name", "").startswith("iPhone")]
              if not phones:
                  continue
              best = min(phones, key=lambda t: rank(t["name"]))
              have = [d for d in devices.get(rt["identifier"], []) if d.get("deviceTypeIdentifier") == best["identifier"]]
              if have:
                  print(have[0]["udid"], best["name"], sep="\t"); break
              try:
                  udid = subprocess.check_output(["xcrun", "simctl", "create", "CW Small", best["identifier"], rt["identifier"]]).decode().strip()
                  print(udid, best["name"], sep="\t"); break
              except subprocess.CalledProcessError:
                  continue
          PY
          ) || SMALL=""
          SMALL_UDID=$(printf '%s' "$SMALL" | cut -f1); SMALL_NAME=$(printf '%s' "$SMALL" | cut -f2)
          if [ -z "$SMALL_UDID" ]; then
            echo "::warning::小さな iPhone のシミュレーターが見つかりませんでした（小さな画面の写真は無し）"
            exit 0
          fi
          echo "small simulator: $SMALL_NAME ($SMALL_UDID)"
          echo "$SMALL_NAME" > "$OUT/small-device.txt"
          if [ "$SMALL_UDID" != "$UDID" ]; then
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl boot "$SMALL_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$SMALL_UDID" -b >/dev/null || { echo "::warning::小さな iPhone が起動しませんでした"; exit 0; }
            xcrun simctl install "$SMALL_UDID" "$APP" || { echo "::warning::小さな iPhone に入れられませんでした"; exit 0; }
          fi
          shoot "$SMALL_UDID" "small-"
          shoot "$SMALL_UDID" "small-axl-" $AXL
          ls -la "$OUT" | grep -E "axl-|small-" || true

      - name: 見本の画面を ci-previews ブランチに置く（Claude が読める場所）
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/report"
          [ -d "$SRC" ] || exit 0
          DEST="$RUNNER_TEMP/previews-branch"
          git clone --quiet --depth 1 --branch ci-previews "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DEST" 2>/dev/null || {
            mkdir -p "$DEST" && cd "$DEST" && git init --quiet && git checkout --quiet -b ci-previews && \
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          }
          cd "$DEST"
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')"
          rm -rf "$DIR" && mkdir -p "$DIR"
          cp "$SRC"/*.png "$DIR"/ 2>/dev/null || true
          [ -d "$SRC/previews" ] && cp "$SRC"/previews/*.png "$DIR"/ 2>/dev/null || true
          [ -d "$SRC/previews" ] && cp "$SRC"/previews/*.txt "$DIR"/ 2>/dev/null || true
          echo "${{ github.sha }}" > "$DIR/COMMIT"
          git add -A
          git -c user.name="ios-check" -c user.email="ios-check@users.noreply.github.com" commit --quiet -m "previews for $HEAD_REF @ ${{ github.sha }}" || exit 0
          git push --quiet origin ci-previews || echo "::warning::ci-previews に置けませんでした"

      - name: 結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check-report
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14
