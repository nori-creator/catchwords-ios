# iOS 版の確認（iPhone が無くても見られるようにする）
#
# 何をするか:
#   1. GitHub が用意する Mac の上で、iOS アプリを組み立てる（=コンパイルが通るかの確認）。
#   2. iPhone のシミュレーター（画面上で動く仮想の iPhone）で起動する。
#   3. 起動直後の画面の写真と、20 秒の動画を撮る。
#      主な画面は、大きな文字（AX2）と小さな iPhone（SE 第3世代）でも撮る（axl-* / small-*）。
#   4. 結果を「ios-check-report」という成果物（Artifacts）として保存する。
#
# 見方: GitHub のリポジトリ → Actions → 「iOS check（iOS 版の確認）」→ 最新の実行 →
#       下の Artifacts から ios-check-report をダウンロード → 中の写真・動画を開く。
#
# 限界: シミュレーターではカメラと「被写体の切り抜き（Vision）」は動かない。
#       その 2 つは TestFlight で本物の iPhone に入れて確かめる。
name: iOS check（iOS 版の確認）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 走っている確認は止めない（止めると見本画面が届かない）。待ちは最新の1つだけ残る。
concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-shoot:
    runs-on: macos-26
    # 撮影までで 45〜55 分（10/16 の実行）。版25 の見本を足して 55 分ほど（10/25）。日記と本の見本（PR #5）と褒める演出の見本を
    # 合わせて 76 分（10/25、75 分の上限で一度止められた）。ci-previews に置くのは自分の場所だけを取り出して数秒で済ませるが、
    # 10/25 に一度 25 分止まったので、その手順にだけ 12 分の上限を付け、結果の保存まで届くようにする。
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: 表示の言語が混ざらないか確かめる（訳のない日本語や、どれか1つの表示言語の訳が無ければ失敗）
        run: |
          python3 scripts/l10n_languages.py --check
          python3 scripts/check_l10n.py
          python3 scripts/check_server_text.py

      - name: 言語の混在の規則を、過去の事例すべてで確かめる（docs/language-rules.md）
        run: |
          swiftc -O ios/Shared/DisplayLanguages.swift ios/CatchWords/Utilities/LanguageRules.swift ios/CatchWords/Utilities/ChunkRules.swift ios/CatchWords/Utilities/Sentences.swift ios/LanguageRules/main.swift -o "$RUNNER_TEMP/language-rules"
          "$RUNNER_TEMP/language-rules" ios/LanguageRules/cases.json

      - name: Xcode の版を表示
        run: xcodebuild -version

      - name: シミュレーターを先に起動する（組み立てと並べて、待ち時間を短くする）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
              phones = phones or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true

      - name: シミュレーター用に組み立てる
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          # 失敗したら error: の行を注釈（Annotations）にも出す（ログを開けなくても、PR の画面と API で読める）
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::組み立てに失敗しました（上の error: を見てください）"; exit 1; }

      - name: 図鑑の影の SF Symbols と4択の補充語・保存の失敗の扱いを確かめる（DexCatalogSymbolTests・QuizPoolTests・CardCatchPickTests・SaveErrorTests などだけを走らせる）
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project CatchWords.xcodeproj \
            -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:CatchWordsTests/DexCatalogSymbolTests \
            -only-testing:CatchWordsTests/PlanLimitTests \
            -only-testing:CatchWordsTests/QuizPoolTests \
            -only-testing:CatchWordsTests/CardCatchPickTests \
            -only-testing:CatchWordsTests/MeaningGlossTests \
            -only-testing:CatchWordsTests/CatchScanTests \
            -only-testing:CatchWordsTests/ReadingAndCategoryTests \
            -only-testing:CatchWordsTests/SentencesTests \
            -only-testing:CatchWordsTests/ExampleSceneTests \
            -only-testing:CatchWordsTests/NameRegisterTests \
            -only-testing:CatchWordsTests/HeadwordGuardTests \
            -only-testing:CatchWordsTests/SaveErrorTests \
            -only-testing:CatchWordsTests/ReviewGradeTests \
            -only-testing:CatchWordsTests/MaskCoverageTests \
            -only-testing:CatchWordsTests/TagPlacementTests \
            -only-testing:CatchWordsTests/LegalURLTests \
            -only-testing:CatchWordsTests/PraiseScheduleTests \
            -only-testing:CatchWordsTests/AuthCallbackTests \
            -only-testing:CatchWordsTests/ChunkReadingTests \
            -only-testing:CatchWordsTests/ReviewHeadwordTests \
            -only-testing:CatchWordsTests/AlbumDayTests \
            -only-testing:CatchWordsTests/DiaryTests \
            -only-testing:CatchWordsTests/WordCardPrefsTests \
            -only-testing:CatchWordsTests/ServerMessageTests \
            -only-testing:CatchWordsTests/SharingRuleTests \
            -only-testing:CatchWordsTests/MemoMarksTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/symbols.log" | grep -E "error:|Test Case|failed|passed|TEST (SUCCEEDED|FAILED)|BUILD FAILED" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/symbols.log" || { grep -E "error:" "$RUNNER_TEMP/symbols.log" | awk -F'error: ' '{ split($2, t, " : "); if (!(t[1] in seen)) { seen[t[1]] = 1; print } }' | head -10 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::図鑑の影の SF Symbols の確認に失敗しました（上のログを見てください）"; exit 1; }

      - name: シミュレーターで起動して撮影する
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/report"
          mkdir -p "$OUT"
          # 入っている iPhone シミュレーターのうち、最も新しい iOS の「iPhone 1x Pro」系を選ぶ
          # 組み立ての前に起動を始めてある（下の「シミュレーターを先に起動する」）。ここでは待つだけ。
          UDID=$(cat "$RUNNER_TEMP/udid")
          echo "simulator: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "$BUNDLE_ID" > "$RUNNER_TEMP/bundle"
          xcrun simctl install "$UDID" "$APP"
          # アプリは画面の決まった要素が出たら Library/Caches/ui-ready/<名前> を置く（Views/UIPreview.swift の
          # UIReady）。撮る前にそれを待つので、起動が遅い・切り替わりの途中で真っ白な写真にならない。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data || echo "$RUNNER_TEMP/no-data-container")
          echo "$DATA" > "$RUNNER_TEMP/datadir"
          rm -rf "$DATA/Library/Caches/ui-ready"
          # 許可ダイアログで画面が隠れないよう、先に許可しておく
          for s in camera microphone photos location; do xcrun simctl privacy "$UDID" grant "$s" "$BUNDLE_ID" || true; done
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$OUT/launch.mp4" &
          REC=$!
          sleep 2
          # -uiDemo: the offline demo backend answers every request (never production; no stray accounts)
          START=$SECONDS
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiDemo zh-TW -uiDemoReset YES
          # 最初の本当の画面（ログインかホーム）が出るまで待つ（最大 30 秒）。3 秒の写真はそれより前には撮らない
          n=0
          while [ ! -f "$DATA/Library/Caches/ui-ready/root" ] && [ $n -lt 120 ]; do sleep 0.25; n=$((n + 1)); done
          [ -f "$DATA/Library/Caches/ui-ready/root" ] || echo "::warning::起動後の最初の画面が出るのを待ちきれませんでした"
          for t in 3 8 15; do
            while [ $(( SECONDS - START )) -lt "$t" ]; do sleep 0.5; done
            xcrun simctl io "$UDID" screenshot "$OUT/screen-${t}s.png"
          done
          sleep 5
          kill -INT $REC; wait $REC || true
          # 起動直後に落ちていないか（落ちていれば失敗にする）
          # 一覧はファイルに書いてから探す。`| grep -q` だと見つけた瞬間に grep が閉じ、launchctl が
          # SIGPIPE で終わり、pipefail のせいで「起動していない」と誤判定する（2026-10-01 に実際に起きた）。
          xcrun simctl spawn "$UDID" launchctl list > "$RUNNER_TEMP/launchctl.txt" || true
          grep -q "$BUNDLE_ID" "$RUNNER_TEMP/launchctl.txt" || { echo "::error::アプリが起動後に終了しました"; exit 1; }

      - name: 見本の画面を撮る（アニメーションはコマ送り）
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle"); DATA=$(cat "$RUNNER_TEMP/datadir")
          READY="$DATA/Library/Caches/ui-ready/preview"
          # 名前 / 画面の決まった要素が出てから待つ秒 / コマ数（撮影の間隔はおよそ 0.4〜0.6 秒）
          for spec in "tabbar 2 1" "picker 2 1" "cutout 0 12" "reward 0 14" "variants 0 10" "get 0 16" "get-again 0 16" "landing 0 16" "landing-again 0 16" "analyzing 0 16" "scanslow 0 24" "hero 2 1" "memorial 0 10" "hero-dark 2 1" "tabbar-dark 2 1" "carousel 2 1" "detail 3 1" "detail-dark 3 1" "settings 2 1" "settings-dark 2 1" "settings-en 2 1" "settings-zh 2 1" "aisettings 2 1" "aisettings-dark 2 1" "aisettings-en 2 1" "aisettings-zh 2 1" "aistats 2 1" "aistats-en 2 1" "aistats-zh 2 1" "aicosts 2 1" "aicosts-en 2 1" "aicosts-zh 2 1" "detail-en 3 1" "detail-zh 3 1" "hero-zh 2 1" "auth 3 1" "auth-dark 3 1" "auth-en 3 1" "auth-zh 3 1" "signin 2 1" "signin-en 2 1" "onboarding-en 3 1" "onboarding-zh 3 1" "aiconsent 2 1" "aiconsent-en 2 1" "aiconsent-zh 2 1" "paywall-en 2 1" "paywall-zh 2 1" "dex-en 2 1" "dex-zh 2 1" "jadetail-en 3 1" "jadetail-zh 3 1" "endetail-ja 3 1" "endetail-zh 3 1" "quiz-en 2 1" "answer-en 2 1" "answer-zh 2 1" "jaquiz-en 2 1" "jaquiz-zh 2 1" "enanswer-ja 2 1" "enanswer-zh 2 1" "picker-en 2 1" "japicker-en 2 1" "japicker-zh 2 1" "enpicker-ja 2 1" "enpicker-zh 2 1" "done 3 1" "done-en 3 1" "done-zh 3 1" "homeload 1 1" "homeload-en 1 1" "chunks 2 1" "chunks-en 2 1" "answer 2 1" "tips 3 1" "tips-zh 3 1" "examples 3 1" "examples-en 3 1" "sunscreen 3 1" "sunscreen-en 3 1" "sunscreen-zh 3 1" "unsaved 3 1" "unsaved-en 3 1" "devlog 2 1" "selfie 3 1" "selfie-original 3 1" "selfie-zh 3 1" "slides 1 14" "choose 1 1" "choose-en 1 1" "choose-zh 1 1" "typed 1 1" "typed-en 1 1" "tips-en 3 1" "picker4 6 1" "picker4-en 6 1" "picker4-nopos 6 1" "tabbar-en 2 1" "praise 0 10" "praise-en 0 10" "praise-first 0 10" "praise-first-zh 0 10" "praise-retention 0 10" "review-ask 3 1" "home-again 4 1" "readings 2 1" "readings-en 2 1" "readings-pinyin 2 1" "reports 2 1" "reports-en 2 1" "map 3 1" "map-en 3 1" "regen 2 1" "chunks-narrow 2 1" "patterns 3 1" "patterns-en 3 1" "patterns-zh 3 1" "patterns-pinyin 3 1" "patterns-pos 3 1" "patterns-dark 3 1" "patterns-legacy 3 1" "word25 3 1" "word25-chunks 3 1" "word25-pinyin 3 1" "word25-examples 3 1" "word25-pinyinex 4 1" "word25-xl 3 1" "word25-small 3 1" "word25-related 3 1" "word25-memo 3 1" "word25-links 3 1" "word25-review 3 1" "word25-reviewzh 3 1" "word25-panel 4 1" "word25-dark 3 1" "word25-chunks-dark 3 1" "word25-examples-dark 3 1" "word25-panel-dark 4 1" "word25-chunks-en 3 1" "word25-examples-en 3 1" "word25-related-en 3 1" "word25-panel-en 4 1" "word25-chunks-zh 3 1" "word25-examples-zh 3 1" "word25-panel-zh 4 1" "word25-chunks-es 3 1" "word25-examples-es 3 1" "word25-panel-es 4 1" "word25-chunks-ko 3 1" "word25-examples-ko 3 1" "word25-panel-ko 4 1" "word25-chunks-vi 3 1" "word25-examples-vi 3 1" "word25-panel-vi 4 1" "word25-links-vi 3 1" "settings-es 2 1" "settings-ko 2 1" "settings-vi 2 1" "onboarding-es 3 1" "onboarding-ko 3 1" "onboarding-vi 3 1" "auth-es 3 1" "auth-ko 3 1" "auth-vi 3 1" "detail-es 3 1" "detail-ko 3 1" "detail-vi 3 1" "dex-es 2 1" "tabbar-ko 2 1" "paywall-vi 2 1" "choose-es 1 1" "picker-ko 2 1" "answer-vi 2 1" "diary 2 1" "diary-en 2 1" "diary-zh 2 1" "diary-style 2 1" "spread 0 8" "spread-en 3 1" "spread-curl 3 1" "spread-curl-late 3 1" "spread-cover 2 1" "spread-lookback 3 1" "diary-lookback 2 1" "diary-notes 2 1" "diary-correction 3 1" "diary-correction-en 3 1" "quiz-duo 3 1" "home-duo 3 1" "dex-duo 2 1" "detail-duo 3 1" "word25-duo 3 1" "answer-duo 3 1" "settings-duo 2 1" "paywall-duo 2 1" "aiconsent-duo 2 1" "camblocked-duo 2 1" "picker-duo 2 1" "onboarding-duo 3 1" "auth-duo 3 1" "tabbar-duo 2 1" "home-duoland 3 1" "tabbar-duoland 2 1" "dex-duoland 2 1" "detail-duoland 3 1" "word25-duoland 3 1" "quiz-duoland 3 1" "answer-duoland 3 1" "settings-duoland 2 1" "paywall-duoland 2 1" "aiconsent-duoland 2 1" "camblocked-duoland 2 1" "picker-duoland 2 1" "onboarding-duoland 3 1" "auth-duoland 3 1" "praise-duoland 0 6" "get-duoland 2 4" "variants-duoland 1 4" "landing-duoland 2 4" "reward-duoland 2 3" "praise-duo 0 6" "get-duo 2 4" "variants-duo 1 4" "landing-duo 2 4" "reward-duo 2 3"; do
            set -- $spec
            name=$1; wait_s=$2; frames=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            rm -f "$READY"
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW || { echo "::warning::$name を開けませんでした"; continue; }
            # 見本の画面の決まった要素（4択のカード・分析の画面・ネットの画像など）が出るまで待つ（最大 20 秒）
            n=0
            while [ ! -f "$READY" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
            [ -f "$READY" ] || echo "::warning::$name の画面が出るのを待ちきれませんでした"
            sleep "$wait_s"
            for i in $(seq -w 1 "$frames"); do
              xcrun simctl io "$UDID" screenshot "$OUT/${name}-${i}.png" >/dev/null 2>&1 || true
              sleep 0.4
            done
          done
          ls -la "$OUT"

      # キャッチのスキャン（v10、オーナー承認 2026-10-11）を動画で撮る。シミュレーターでは Vision の切り抜きが
      # 動かないので、見本の写真（UIPreview.swift の ScanFixtures、輪郭はアプリと同じ CatchOutlineTracer で取る）で
      # 名前が 2.4 秒後（ペンが追いつく）と 6.0 秒後（小さい光が回って待つ）の2本。ios-check-report の videos/ に入る。
      - name: キャッチのスキャン（v10）を動画で撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/videos"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          for spec in "analyzing 9" "scanslow 13" "regen 10" "spread 6" "spread-turn 7"; do
            set -- $spec
            name=$1; secs=$2
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/scan-${name}.mp4" &
            REC=$!
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW >/dev/null || echo "::warning::$name を開けませんでした"
            sleep "$secs"
            kill -INT $REC; wait $REC
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          ls -la "$OUT"

      # キャッチの演出（v10 のスキャン、v6 の選ぶ画面・ゲット・図鑑へ）のコマ落ちを数える（オーナー 2026-10-20:
      # 「限界まで滑らかなアニメーション」）。アプリの FrameMeter（UITestTrace.swift）が 1 秒ごとに遅れたコマを書く。
      # 録画は CPU を使うので、数える回は録画しない。シミュレーターの数字なので、端末の値ではなく変更の前後の比較に使う。
      # 録画は artifact（ios-check-report の videos/）に置く。ci-previews には入れない（履歴が膨らんだため、2026-10-23）。
      - name: キャッチの演出のコマ落ちを数え、動画で撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/videos"
          mkdir -p "$OUT" "$RUNNER_TEMP/report/previews"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || echo "$RUNNER_TEMP/no-data-container")
          TRACE="$DATA/Library/Caches/uitest-trace.txt"
          SUM="$RUNNER_TEMP/report/previews/frames.txt"
          : > "$SUM"
          # 今の描き方（now）と、軽くする前の描き方（before: -catchLegacyDraw YES）を交互に 2 回ずつ。
          for round in 1 2; do
            for mode in now before; do
              legacy=NO; [ "$mode" = before ] && legacy=YES
              for spec in "analyzing 8" "variants 7" "get 9" "landing 9"; do
                set -- $spec
                name=$1; secs=$2
                xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
                rm -f "$TRACE"
                xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW -catchLegacyDraw "$legacy" >/dev/null || continue
                sleep "$secs"
                xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
                sleep 0.5
                # The last "all:" totals of the run: frames shown, late frames, refreshes lost.
                line=$(grep -o "all: frames [0-9]* late [0-9]* lost [0-9]*" "$TRACE" 2>/dev/null | tail -1)
                echo "round $round $mode $name: ${line:-no late frames}" | tee -a "$SUM"
                grep -E "frames [0-9]+ late" "$TRACE" 2>/dev/null | sed "s/^/    $mode $name /" >> "$SUM"
              done
            done
          done
          # 録画も両方の描き方で（オーナー 2026-10-20: マージの前に見た目が変わっていないか見比べる）。
          for spec in "analyzing 8" "variants 7" "get 9" "landing 9"; do
            set -- $spec
            name=$1; secs=$2
            for mode in now before; do
              legacy=NO; [ "$mode" = before ] && legacy=YES
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/catch-${name}-${mode}.mp4" &
              REC=$!
              sleep 1
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW -catchLegacyDraw "$legacy" >/dev/null
              sleep "$secs"
              kill -INT $REC; wait $REC
            done
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          cat "$SUM"

      # 監査 D-04: 主な画面だけを (1) 大きな文字（アクセシビリティの「大」= AX2、アプリの上限）と
      # (2) 小さな iPhone（iPhone SE 第3世代。無ければ入っている中で一番小さい iPhone）で撮る。
      # ファイル名: axl-<画面>.png / small-<画面>.png / small-axl-<画面>.png（端末名は small-device.txt）。
      # 失敗してもこの確認全体は赤にしない（撮れなかった画面は警告だけ）。
      - name: 大きな文字と小さな iPhone で主な画面を撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          AXL="-UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL"
          # 名前 / 待つ秒: ホーム・図鑑・単語の詳細・復習の4択・設定・カメラ不許可・AI の同意
          SCENES="home:3 dex:2 detail:3 quiz:2 settings:2 camblocked:2 aiconsent:2"
          shoot() {  # shoot <udid> <ファイル名の頭> [追加の起動引数...]
            local dev=$1 prefix=$2; shift 2
            # 他の見本と同じく、画面の決まった要素が出た印（ui-ready/preview）を待ってから撮る（監査 D-10）。
            local data ready
            data=$(xcrun simctl get_app_container "$dev" "$BUNDLE_ID" data 2>/dev/null || echo "$RUNNER_TEMP/no-data-container")
            ready="$data/Library/Caches/ui-ready/preview"
            for spec in $SCENES; do
              local name=${spec%%:*} wait_s=${spec##*:} n=0
              xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
              rm -f "$ready"
              xcrun simctl launch "$dev" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW ${1+"$@"} >/dev/null || { echo "::warning::$prefix$name を開けませんでした"; continue; }
              while [ ! -f "$ready" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
              [ -f "$ready" ] || echo "::warning::$prefix$name の画面が出るのを待ちきれませんでした"
              sleep "$wait_s"
              xcrun simctl io "$dev" screenshot "$OUT/${prefix}${name}.png" >/dev/null 2>&1 || echo "::warning::$prefix$name を撮れませんでした"
            done
            xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
          }
          # (1) いつものシミュレーターで、大きな文字
          shoot "$UDID" "axl-" $AXL
          # (2) 小さな iPhone: 無ければ作る。メモリを空けるため、いつものシミュレーターは止める。
          SMALL=$(python3 - <<'PY'
          import json, re, subprocess
          def sim(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
          runtimes = [r for r in sim("runtimes")["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtimes.sort(key=lambda r: [int(x) for x in re.findall(r"\d+", r.get("version", "0"))], reverse=True)
          def rank(name):
              if name == "iPhone SE (3rd generation)": return 0
              if "SE" in name: return 1
              if "mini" in name: return 2
              if re.search(r"\d+e\b", name): return 3            # iPhone 16e
              if not re.search(r"Pro|Plus|Max|Air", name): return 4
              return 9
          devices = sim("devices", "available")["devices"]
          for rt in runtimes:
              phones = [t for t in rt.get("supportedDeviceTypes", []) if t.get("name", "").startswith("iPhone")]
              if not phones:
                  continue
              best = min(phones, key=lambda t: rank(t["name"]))
              have = [d for d in devices.get(rt["identifier"], []) if d.get("deviceTypeIdentifier") == best["identifier"]]
              if have:
                  print(have[0]["udid"], best["name"], sep="\t"); break
              try:
                  udid = subprocess.check_output(["xcrun", "simctl", "create", "CW Small", best["identifier"], rt["identifier"]]).decode().strip()
                  print(udid, best["name"], sep="\t"); break
              except subprocess.CalledProcessError:
                  continue
          PY
          ) || SMALL=""
          SMALL_UDID=$(printf '%s' "$SMALL" | cut -f1); SMALL_NAME=$(printf '%s' "$SMALL" | cut -f2)
          if [ -z "$SMALL_UDID" ]; then
            echo "::warning::小さな iPhone のシミュレーターが見つかりませんでした（小さな画面の写真は無し）"
            exit 0
          fi
          echo "small simulator: $SMALL_NAME ($SMALL_UDID)"
          echo "$SMALL_NAME" > "$OUT/small-device.txt"
          if [ "$SMALL_UDID" != "$UDID" ]; then
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl boot "$SMALL_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$SMALL_UDID" -b >/dev/null || { echo "::warning::小さな iPhone が起動しませんでした"; exit 0; }
            xcrun simctl install "$SMALL_UDID" "$APP" || { echo "::warning::小さな iPhone に入れられませんでした"; exit 0; }
          fi
          shoot "$SMALL_UDID" "small-"
          shoot "$SMALL_UDID" "small-axl-" $AXL
          ls -la "$OUT" | grep -E "axl-|small-" || true

      - name: 見本の画面を ci-previews ブランチに置く（Claude が読める場所）
        if: always()
        timeout-minutes: 12
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/report"
          [ -d "$SRC" ] || exit 0
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')"
          # 枝は最新の 1 コミットだけ（scripts/push_ci_previews.sh）。録画は artifact（ios-check-report）にだけ残す。
          STAGE="$RUNNER_TEMP/previews-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp "$SRC"/*.png "$STAGE"/ 2>/dev/null || true
          [ -d "$SRC/previews" ] && cp "$SRC"/previews/*.png "$SRC"/previews/*.txt "$STAGE"/ 2>/dev/null || true
          # 半分の幅に縮めて置く（10/25 に原寸 350 枚・約 500 MB の push が2回続けて 12 分を超えた）。原寸は artifact にある。
          for f in "$STAGE"/*.png; do [ -f "$f" ] && sips --resampleWidth 603 "$f" >/dev/null 2>&1 || true; done
          du -sh "$STAGE" || true
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          # API で置く（ブランチを取り出さない — 10/25、取り出すだけで 5 分を超え、3 回続けて 12 分の上限で止まった）。
          GITHUB_TOKEN="${{ github.token }}" python3 scripts/push_ci_previews_api.py "${{ github.repository }}" \
            "$DIR" "previews for $HEAD_REF @ ${{ github.sha }}" "$STAGE"/*

      - name: 結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check-report
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

  # TestFlight は Release で組み立てる。Debug だけの名前（#if DEBUG の中のもの）を外で使うと Release だけ壊れる
  # （1.0.1 (1036) の前に一度起きた）。シミュレーター向けに Release で組み立てて、それを先に見つける。署名はしない。
  # TestFlight と同じ Xcode 27.1（iOS 27.1 SDK、iPhone Duo のため。ios-release.yml）で組み立てる。
  release-build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode の版と、App Store Connect へ送る道具（altool）があるか
        run: |
          xcodebuild -version
          xcrun --find altool && xcrun altool --version || echo "::warning::この Xcode に altool が見つかりません（ios-release.yml の送る手順が止まります）"
      - name: Release で組み立てる（TestFlight と同じ設定。署名なし）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/release.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/release.log" || { grep -E "error:" "$RUNNER_TEMP/release.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::Release で組み立てられませんでした（Debug だけの名前を #if DEBUG の外で使っていないか）"; exit 1; }

  # iPhone Duo（オーナー 2026-10-28「iphone duo用に完全対応させて。このアプリを」）: 内側の画面を全面で使うには iOS 27.1 SDK
  # （Xcode 27.1）で組み立てる必要がある（古い SDK では内側で「見慣れた大きさの枠」の中に出るだけ — Apple の Tech Talk
  # 「Design for iPhone Duo」）。GitHub の xcode-27 の画像には Xcode 27.1 と iPhone Duo のシミュレーター（iOS 27.1）がある。
  # ここでは (1) Xcode 27.1 で組み立てられるか、(2) Duo のシミュレーターの2つの画面（内側 2007×2853 と外側 1398×2034、
  # どちらも 3 倍）のそれぞれで主な画面を撮る、(3) シミュレーターが知らせる画面と写真の大きさを記録する。シミュレーターは
  # 閉じた Duo として起動し、アプリは外側の画面（466×678 pt、右の約 84 pt は時計などの帯で、中身は 382 pt の幅）に出る。
  # 開くコマンドは無く（Apple Developer Forums 847883）、画面の電源の切り替えでは代わりにならない（下の手順）ので、
  # 開いた内側の画面は build-and-shoot の「…-duo」の見本（DuoCanvas、669×951 pt）で撮る。写真は ci-previews の
  # runs/<ブランチ>-duo/ に置く。
  duo:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode の版と iPhone Duo のシミュレーターを表示
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "ios|simulator" || true
          xcrun simctl list devicetypes | grep -i -E "duo" || echo "no Duo device type"
          xcrun simctl list runtimes || true

      - name: iPhone Duo のシミュレーターを先に起動する
        run: |
          set -uo pipefail
          UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys
          def sim(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
          for rt, ds in sim("devices", "available")["devices"].items():
              for d in ds:
                  if "Duo" in d.get("name", ""):
                      print(d["udid"]); sys.exit(0)
          types = [t for t in sim("devicetypes")["devicetypes"] if "Duo" in t.get("name", "")]
          runtimes = [r for r in sim("runtimes")["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtimes.sort(key=lambda r: [int(x) for x in re.findall(r"\d+", r.get("version", "0"))], reverse=True)
          for t in types:
              for r in runtimes:
                  try:
                      print(subprocess.check_output(["xcrun", "simctl", "create", "CW Duo", t["identifier"], r["identifier"]]).decode().strip())
                      sys.exit(0)
                  except subprocess.CalledProcessError:
                      continue
          PY
          ) || UDID=""
          [ -n "$UDID" ] || { echo "::error::iPhone Duo のシミュレーターが見つかりませんでした"; exit 1; }
          echo "duo simulator: $UDID"
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true

      - name: Xcode 27.1（iOS 27.1 SDK）でシミュレーター用に組み立てる
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          mkdir -p "$RUNNER_TEMP/duo"
          grep -E "warning:" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -300 > "$RUNNER_TEMP/duo/build-warnings.txt" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::Xcode 27.1 で組み立てられませんでした（上の error: を見てください）"; exit 1; }

      - name: Duo のシミュレーターで主な画面を撮る
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/duo"; mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          for s in camera microphone photos location; do xcrun simctl privacy "$UDID" grant "$s" "$BUNDLE_ID" || true; done
          # シミュレーターの画面（ディスプレイ）の一覧
          xcrun simctl io "$UDID" enumerate > "$OUT/displays.txt" 2>&1
          cat "$OUT/displays.txt"
          # Duo のシミュレーターは画面が2つあり、撮る画面を番号で名指しする（`--display=<番号>`。"internal" / "external" は
          # 通らない）。番号と画素数は、名指ししない時の simctl の断りの文（"--display=3  LCD-1 (primary-1) 2007x2853"）
          # から読む。どの画面も撮る（duo-<画面>-<幅>x<高さ>.png）。
          xcrun simctl io "$UDID" screenshot "$OUT/probe.png" > "$OUT/display-list.txt" 2>&1
          rm -f "$OUT/probe.png"
          DISPLAYS=$(sed -n 's/.*--display=\([0-9][0-9]*\) .* \([0-9][0-9]*x[0-9][0-9]*\)$/\1:\2/p' "$OUT/display-list.txt" | tr '\n' ' ')
          echo "displays: ${DISPLAYS:-one}" | tee -a "$OUT/display-list.txt"
          # この simctl に Duo を開く・閉じる命令があるかを読むため、使い方の一覧を残す。
          { xcrun simctl help; echo; xcrun simctl io "$UDID" 2>&1; } > "$OUT/simctl-help.txt" 2>&1
          # shoot <名前> <画面の一覧>: その時の画面を、一覧の画面それぞれで撮る（一覧が空なら名指ししないで1枚）。
          shoot() {
            if [ -n "$2" ]; then
              for e in $2; do
                xcrun simctl io "$UDID" screenshot --display="${e%%:*}" "$OUT/duo-$1-${e##*:}.png" >/dev/null 2>&1 \
                  || echo "::warning::$1 を画面 ${e%%:*}（${e##*:}）で撮れませんでした"
              done
            else
              xcrun simctl io "$UDID" screenshot "$OUT/duo-$1.png" >/dev/null 2>&1 || echo "::warning::$1 を撮れませんでした"
            fi
          }
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          READY="$DATA/Library/Caches/ui-ready/preview"
          # shoot_all <接頭辞> <画面の一覧>: 主な画面を1つずつ開いて撮る（duo-<接頭辞><画面>-<幅>x<高さ>.png）。
          shoot_all() {
            for spec in "home 3" "tabbar 2" "dex 2" "detail 3" "word25 3" "quiz 2" "answer 3" "settings 2" "camblocked 2" "picker 2" "aiconsent 2" "paywall 2" "onboarding 3" "praise 2" "get 3" "variants 2" "landing 3" "reward 3"; do
              name=${spec%% *}; wait_s=${spec##* }
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null
              rm -f "$READY"
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW >/dev/null || { echo "::warning::$name を開けませんでした"; continue; }
              n=0
              while [ ! -f "$READY" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
              [ -f "$READY" ] || echo "::warning::$name の画面が出るのを待ちきれませんでした"
              sleep "$wait_s"
              shoot "$1$name" "$2"
            done
          }
          # 起動したまま（閉じた Duo）撮る: アプリは外側の画面に出て、内側は黒い。外側を切り内側を入れる
          # （simctl io screenConfig power off / on）と system shell が落ちてアプリを開けなくなる（2026-10-28 に試した）。
          # 開いた Duo の内側は build-and-shoot の「…-duo」の見本（DuoCanvas）で確かめる。
          shoot_all "" "$DISPLAYS"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null
          # 写真の画素数（縮める前）: 画面の大きさを UIPreview の DuoScreen と照らす
          for f in "$OUT"/*.png; do echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {print $2}' | tr '\n' ' ')"; done | tee "$OUT/sizes.txt"
          ls -la "$OUT"

      - name: 写真を ci-previews ブランチに置く（runs/<ブランチ>-duo/）
        if: always()
        timeout-minutes: 12
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/duo"
          [ -d "$SRC" ] || exit 0
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')-duo"
          STAGE="$RUNNER_TEMP/duo-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp "$SRC"/*.png "$SRC"/*.txt "$STAGE"/ 2>/dev/null || true
          for f in "$STAGE"/*.png; do [ -f "$f" ] && sips --resampleWidth 603 "$f" >/dev/null 2>&1 || true; done
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          GITHUB_TOKEN="${{ github.token }}" python3 scripts/push_ci_previews_api.py "${{ github.repository }}" \
            "$DIR" "duo for $HEAD_REF @ ${{ github.sha }}" "$STAGE"/*

      - name: 結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-duo-report
          path: |
            ${{ runner.temp }}/duo
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

  # 切り抜きの確認（docs/cutout-failure-modes.md）: アプリの切り抜きのコード（CatchPlan など）をそのまま Mac 用に
  # 組み立て、本物の Vision で本物の写真を切り抜く。わざと小さい・ずれた箱も含む。前（1.0.1 より前の計画）と今を
  # 並べた画像を ci-previews の runs/<ブランチ>-cutout/ に置く。物の 85% 未満しか入らない・箱の線でまっすぐ切れる・
  # 四角い・ほかの物が混ざる、のどれかがあれば失敗。
  cutout-harness:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 切り抜きの確認を組み立てる（アプリと同じファイル）
        run: |
          set -o pipefail
          swiftc -O \
            ios/CatchWords/Models/CatchPlan.swift \
            ios/CatchWords/Models/CatchGeometry.swift \
            ios/CatchWords/Models/TagPlacement.swift \
            ios/CatchWords/Services/InstanceMasks.swift \
            scripts/cutout-harness/OldCatchPlan.swift \
            scripts/cutout-harness/main.swift \
            -o "$RUNNER_TEMP/cutout-harness" 2>&1 | tee "$RUNNER_TEMP/harness-build.log" || {
              grep -E "error:" "$RUNNER_TEMP/harness-build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; exit 1; }
      - name: 本物の写真を本物の Vision で切り抜く
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cutout"
          sw_vers
          "$RUNNER_TEMP/cutout-harness" scripts/cutout-harness/cases.json "$RUNNER_TEMP/cutout" | tee "$RUNNER_TEMP/cutout/log.txt"
      - name: 結果を ci-previews に置く
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/cutout"
          [ -d "$SRC" ] || exit 0
          [ -f "$SRC/summary.md" ] && cat "$SRC/summary.md" >> "$GITHUB_STEP_SUMMARY"
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')-cutout"
          STAGE="$RUNNER_TEMP/cutout-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp "$SRC"/* "$STAGE"/ 2>/dev/null || true
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          CI_PREVIEWS_REPLACE=1 bash scripts/push_ci_previews.sh "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$DIR" "cut-out harness for $HEAD_REF @ ${{ github.sha }}" "$STAGE"/*

