# iOS 版の確認（iPhone が無くても見られるようにする）
#
# 何をするか:
#   1. GitHub が用意する Mac の上で、iOS アプリを組み立てる（=コンパイルが通るかの確認）。
#   2. iPhone のシミュレーター（画面上で動く仮想の iPhone）で起動する。
#   3. 起動直後の画面の写真と、20 秒の動画を撮る。
#      主な画面は、大きな文字（AX2）と小さな iPhone（SE 第3世代）でも撮る（axl-* / small-*）。
#   4. 結果を「ios-check-report」という成果物（Artifacts）として保存する。
#
# 見方: GitHub のリポジトリ → Actions → 「iOS check（iOS 版の確認）」→ 最新の実行 →
#       下の Artifacts から ios-check-report をダウンロード → 中の写真・動画を開く。
#
# 限界: シミュレーターではカメラと「被写体の切り抜き（Vision）」は動かない。
#       その 2 つは TestFlight で本物の iPhone に入れて確かめる。
name: iOS check（iOS 版の確認）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 走っている確認は止めない（止めると見本画面が届かない）。待ちは最新の1つだけ残る。
concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-shoot:
    runs-on: macos-26
    # 撮影までで 45〜55 分（10/16 の実行）。ci-previews に置くのは自分の場所だけを取り出して数秒で済ませる。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 表示の言語が混ざらないか確かめる（訳のない日本語や、どれか1つの表示言語の訳が無ければ失敗）
        run: |
          python3 scripts/l10n_languages.py --check
          python3 scripts/check_l10n.py
          python3 scripts/check_server_text.py

      - name: 言語の混在の規則を、過去の事例すべてで確かめる（docs/language-rules.md）
        run: |
          swiftc -O ios/Shared/DisplayLanguages.swift ios/CatchWords/Utilities/LanguageRules.swift ios/CatchWords/Utilities/ChunkRules.swift ios/CatchWords/Utilities/Sentences.swift ios/LanguageRules/main.swift -o "$RUNNER_TEMP/language-rules"
          "$RUNNER_TEMP/language-rules" ios/LanguageRules/cases.json

      - name: Xcode の版を表示
        run: xcodebuild -version

      - name: シミュレーターを先に起動する（組み立てと並べて、待ち時間を短くする）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in runtimes:
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
              phones = phones or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "$UDID" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$UDID" || true

      - name: シミュレーター用に組み立てる
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          # 失敗したら error: の行を注釈（Annotations）にも出す（ログを開けなくても、PR の画面と API で読める）
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::組み立てに失敗しました（上の error: を見てください）"; exit 1; }

      - name: 図鑑の影の SF Symbols と4択の補充語・保存の失敗の扱いを確かめる（DexCatalogSymbolTests・QuizPoolTests・CardCatchPickTests・SaveErrorTests などだけを走らせる）
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project CatchWords.xcodeproj \
            -scheme CatchWords \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:CatchWordsTests/DexCatalogSymbolTests \
            -only-testing:CatchWordsTests/PlanLimitTests \
            -only-testing:CatchWordsTests/QuizPoolTests \
            -only-testing:CatchWordsTests/CardCatchPickTests \
            -only-testing:CatchWordsTests/MeaningGlossTests \
            -only-testing:CatchWordsTests/CatchScanTests \
            -only-testing:CatchWordsTests/ReadingAndCategoryTests \
            -only-testing:CatchWordsTests/SentencesTests \
            -only-testing:CatchWordsTests/ExampleSceneTests \
            -only-testing:CatchWordsTests/NameRegisterTests \
            -only-testing:CatchWordsTests/HeadwordGuardTests \
            -only-testing:CatchWordsTests/SaveErrorTests \
            -only-testing:CatchWordsTests/ReviewGradeTests \
            -only-testing:CatchWordsTests/MaskCoverageTests \
            -only-testing:CatchWordsTests/TagPlacementTests \
            -only-testing:CatchWordsTests/LegalURLTests \
            -only-testing:CatchWordsTests/AuthCallbackTests \
            -only-testing:CatchWordsTests/ChunkReadingTests \
            -only-testing:CatchWordsTests/ReviewHeadwordTests \
            -only-testing:CatchWordsTests/AlbumDayTests \
            -only-testing:CatchWordsTests/WordCardPrefsTests \
            -only-testing:CatchWordsTests/ServerMessageTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/symbols.log" | grep -E "error:|Test Case|failed|passed|TEST (SUCCEEDED|FAILED)|BUILD FAILED" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/symbols.log" || { grep -E "error:" "$RUNNER_TEMP/symbols.log" | awk -F'error: ' '{ split($2, t, " : "); if (!(t[1] in seen)) { seen[t[1]] = 1; print } }' | head -10 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::図鑑の影の SF Symbols の確認に失敗しました（上のログを見てください）"; exit 1; }

      - name: シミュレーターで起動して撮影する
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/report"
          mkdir -p "$OUT"
          # 入っている iPhone シミュレーターのうち、最も新しい iOS の「iPhone 1x Pro」系を選ぶ
          # 組み立ての前に起動を始めてある（下の「シミュレーターを先に起動する」）。ここでは待つだけ。
          UDID=$(cat "$RUNNER_TEMP/udid")
          echo "simulator: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "$BUNDLE_ID" > "$RUNNER_TEMP/bundle"
          xcrun simctl install "$UDID" "$APP"
          # アプリは画面の決まった要素が出たら Library/Caches/ui-ready/<名前> を置く（Views/UIPreview.swift の
          # UIReady）。撮る前にそれを待つので、起動が遅い・切り替わりの途中で真っ白な写真にならない。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data || echo "$RUNNER_TEMP/no-data-container")
          echo "$DATA" > "$RUNNER_TEMP/datadir"
          rm -rf "$DATA/Library/Caches/ui-ready"
          # 許可ダイアログで画面が隠れないよう、先に許可しておく
          for s in camera microphone photos location; do xcrun simctl privacy "$UDID" grant "$s" "$BUNDLE_ID" || true; done
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$OUT/launch.mp4" &
          REC=$!
          sleep 2
          # -uiDemo: the offline demo backend answers every request (never production; no stray accounts)
          START=$SECONDS
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiDemo zh-TW -uiDemoReset YES
          # 最初の本当の画面（ログインかホーム）が出るまで待つ（最大 30 秒）。3 秒の写真はそれより前には撮らない
          n=0
          while [ ! -f "$DATA/Library/Caches/ui-ready/root" ] && [ $n -lt 120 ]; do sleep 0.25; n=$((n + 1)); done
          [ -f "$DATA/Library/Caches/ui-ready/root" ] || echo "::warning::起動後の最初の画面が出るのを待ちきれませんでした"
          for t in 3 8 15; do
            while [ $(( SECONDS - START )) -lt "$t" ]; do sleep 0.5; done
            xcrun simctl io "$UDID" screenshot "$OUT/screen-${t}s.png"
          done
          sleep 5
          kill -INT $REC; wait $REC || true
          # 起動直後に落ちていないか（落ちていれば失敗にする）
          # 一覧はファイルに書いてから探す。`| grep -q` だと見つけた瞬間に grep が閉じ、launchctl が
          # SIGPIPE で終わり、pipefail のせいで「起動していない」と誤判定する（2026-10-01 に実際に起きた）。
          xcrun simctl spawn "$UDID" launchctl list > "$RUNNER_TEMP/launchctl.txt" || true
          grep -q "$BUNDLE_ID" "$RUNNER_TEMP/launchctl.txt" || { echo "::error::アプリが起動後に終了しました"; exit 1; }

      - name: 見本の画面を撮る（アニメーションはコマ送り）
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle"); DATA=$(cat "$RUNNER_TEMP/datadir")
          READY="$DATA/Library/Caches/ui-ready/preview"
          # 名前 / 画面の決まった要素が出てから待つ秒 / コマ数（撮影の間隔はおよそ 0.4〜0.6 秒）
          for spec in "tabbar 2 1" "picker 2 1" "cutout 0 12" "reward 0 14" "variants 0 10" "get 0 16" "get-again 0 16" "landing 0 16" "landing-again 0 16" "analyzing 0 16" "scanslow 0 24" "hero 2 1" "memorial 0 10" "hero-dark 2 1" "tabbar-dark 2 1" "carousel 2 1" "detail 3 1" "detail-dark 3 1" "settings 2 1" "settings-dark 2 1" "settings-en 2 1" "settings-zh 2 1" "aisettings 2 1" "aisettings-dark 2 1" "aisettings-en 2 1" "aisettings-zh 2 1" "aistats 2 1" "aistats-en 2 1" "aistats-zh 2 1" "aicosts 2 1" "aicosts-en 2 1" "aicosts-zh 2 1" "detail-en 3 1" "detail-zh 3 1" "hero-zh 2 1" "auth 3 1" "auth-dark 3 1" "auth-en 3 1" "auth-zh 3 1" "signin 2 1" "signin-en 2 1" "onboarding-en 3 1" "onboarding-zh 3 1" "aiconsent 2 1" "aiconsent-en 2 1" "aiconsent-zh 2 1" "paywall-en 2 1" "paywall-zh 2 1" "dex-en 2 1" "dex-zh 2 1" "jadetail-en 3 1" "jadetail-zh 3 1" "endetail-ja 3 1" "endetail-zh 3 1" "quiz-en 2 1" "answer-en 2 1" "answer-zh 2 1" "jaquiz-en 2 1" "jaquiz-zh 2 1" "enanswer-ja 2 1" "enanswer-zh 2 1" "picker-en 2 1" "japicker-en 2 1" "japicker-zh 2 1" "enpicker-ja 2 1" "enpicker-zh 2 1" "done 3 1" "done-en 3 1" "done-zh 3 1" "homeload 1 1" "homeload-en 1 1" "chunks 2 1" "chunks-en 2 1" "answer 2 1" "tips 3 1" "tips-zh 3 1" "examples 3 1" "examples-en 3 1" "sunscreen 3 1" "sunscreen-en 3 1" "sunscreen-zh 3 1" "unsaved 3 1" "unsaved-en 3 1" "devlog 2 1" "selfie 3 1" "selfie-original 3 1" "selfie-zh 3 1" "slides 1 14" "choose 1 1" "choose-en 1 1" "choose-zh 1 1" "typed 1 1" "typed-en 1 1" "tips-en 3 1" "picker4 6 1" "picker4-en 6 1" "picker4-nopos 6 1" "tabbar-en 2 1" "tabbar-b 2 1" "tabbar-b-en 2 1" "home-again 4 1" "readings 2 1" "readings-en 2 1" "readings-pinyin 2 1" "reports 2 1" "reports-en 2 1" "map 3 1" "map-en 3 1" "regen 2 1" "chunks-narrow 2 1" "patterns 3 1" "patterns-en 3 1" "patterns-zh 3 1" "patterns-pinyin 3 1" "patterns-pos 3 1" "patterns-dark 3 1" "settings-es 2 1" "settings-ko 2 1" "settings-vi 2 1" "onboarding-es 3 1" "onboarding-ko 3 1" "onboarding-vi 3 1" "auth-es 3 1" "auth-ko 3 1" "auth-vi 3 1" "detail-es 3 1" "detail-ko 3 1" "detail-vi 3 1" "dex-es 2 1" "tabbar-ko 2 1" "paywall-vi 2 1" "choose-es 1 1" "picker-ko 2 1" "answer-vi 2 1"; do
            set -- $spec
            name=$1; wait_s=$2; frames=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            rm -f "$READY"
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW || { echo "::warning::$name を開けませんでした"; continue; }
            # 見本の画面の決まった要素（4択のカード・分析の画面・ネットの画像など）が出るまで待つ（最大 20 秒）
            n=0
            while [ ! -f "$READY" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
            [ -f "$READY" ] || echo "::warning::$name の画面が出るのを待ちきれませんでした"
            sleep "$wait_s"
            for i in $(seq -w 1 "$frames"); do
              xcrun simctl io "$UDID" screenshot "$OUT/${name}-${i}.png" >/dev/null 2>&1 || true
              sleep 0.4
            done
          done
          ls -la "$OUT"

      # キャッチのスキャン（v10、オーナー承認 2026-10-11）を動画で撮る。シミュレーターでは Vision の切り抜きが
      # 動かないので、見本の写真（UIPreview.swift の ScanFixtures、輪郭はアプリと同じ CatchOutlineTracer で取る）で
      # 名前が 2.4 秒後（ペンが追いつく）と 6.0 秒後（小さい光が回って待つ）の2本。ios-check-report の videos/ に入る。
      - name: キャッチのスキャン（v10）を動画で撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/videos"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          for spec in "analyzing 9" "scanslow 13" "regen 10"; do
            set -- $spec
            name=$1; secs=$2
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/scan-${name}.mp4" &
            REC=$!
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW >/dev/null || echo "::warning::$name を開けませんでした"
            sleep "$secs"
            kill -INT $REC; wait $REC
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          ls -la "$OUT"

      # キャッチの演出（v10 のスキャン、v6 の選ぶ画面・ゲット・図鑑へ）のコマ落ちを数える（オーナー 2026-10-20:
      # 「限界まで滑らかなアニメーション」）。アプリの FrameMeter（UITestTrace.swift）が 1 秒ごとに遅れたコマを書く。
      # 録画は CPU を使うので、数える回は録画しない。シミュレーターの数字なので、端末の値ではなく変更の前後の比較に使う。
      # 録画は ci-previews に置く（Claude がお手本の動画とコマごとに比べる）。
      - name: キャッチの演出のコマ落ちを数え、動画で撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/videos"
          mkdir -p "$OUT" "$RUNNER_TEMP/report/previews"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || echo "$RUNNER_TEMP/no-data-container")
          TRACE="$DATA/Library/Caches/uitest-trace.txt"
          SUM="$RUNNER_TEMP/report/previews/frames.txt"
          : > "$SUM"
          # 今の描き方（now）と、軽くする前の描き方（before: -catchLegacyDraw YES）を交互に 2 回ずつ。
          for round in 1 2; do
            for mode in now before; do
              legacy=NO; [ "$mode" = before ] && legacy=YES
              for spec in "analyzing 8" "variants 7" "get 9" "landing 9"; do
                set -- $spec
                name=$1; secs=$2
                xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
                rm -f "$TRACE"
                xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW -catchLegacyDraw "$legacy" >/dev/null || continue
                sleep "$secs"
                xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
                sleep 0.5
                # The last "all:" totals of the run: frames shown, late frames, refreshes lost.
                line=$(grep -o "all: frames [0-9]* late [0-9]* lost [0-9]*" "$TRACE" 2>/dev/null | tail -1)
                echo "round $round $mode $name: ${line:-no late frames}" | tee -a "$SUM"
                grep -E "frames [0-9]+ late" "$TRACE" 2>/dev/null | sed "s/^/    $mode $name /" >> "$SUM"
              done
            done
          done
          # 録画も両方の描き方で（オーナー 2026-10-20: マージの前に見た目が変わっていないか見比べる）。
          for spec in "analyzing 8" "variants 7" "get 9" "landing 9"; do
            set -- $spec
            name=$1; secs=$2
            for mode in now before; do
              legacy=NO; [ "$mode" = before ] && legacy=YES
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/catch-${name}-${mode}.mp4" &
              REC=$!
              sleep 1
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW -catchLegacyDraw "$legacy" >/dev/null
              sleep "$secs"
              kill -INT $REC; wait $REC
            done
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          cat "$SUM"

      # 監査 D-04: 主な画面だけを (1) 大きな文字（アクセシビリティの「大」= AX2、アプリの上限）と
      # (2) 小さな iPhone（iPhone SE 第3世代。無ければ入っている中で一番小さい iPhone）で撮る。
      # ファイル名: axl-<画面>.png / small-<画面>.png / small-axl-<画面>.png（端末名は small-device.txt）。
      # 失敗してもこの確認全体は赤にしない（撮れなかった画面は警告だけ）。
      - name: 大きな文字と小さな iPhone で主な画面を撮る
        continue-on-error: true
        run: |
          set +e -uo pipefail
          OUT="$RUNNER_TEMP/report/previews"
          mkdir -p "$OUT"
          UDID=$(cat "$RUNNER_TEMP/udid"); BUNDLE_ID=$(cat "$RUNNER_TEMP/bundle")
          APP="$RUNNER_TEMP/build/Debug-iphonesimulator/CatchWords.app"
          AXL="-UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL"
          # 名前 / 待つ秒: ホーム・図鑑・単語の詳細・復習の4択・設定・カメラ不許可・AI の同意
          SCENES="home:3 dex:2 detail:3 quiz:2 settings:2 camblocked:2 aiconsent:2"
          shoot() {  # shoot <udid> <ファイル名の頭> [追加の起動引数...]
            local dev=$1 prefix=$2; shift 2
            # 他の見本と同じく、画面の決まった要素が出た印（ui-ready/preview）を待ってから撮る（監査 D-10）。
            local data ready
            data=$(xcrun simctl get_app_container "$dev" "$BUNDLE_ID" data 2>/dev/null || echo "$RUNNER_TEMP/no-data-container")
            ready="$data/Library/Caches/ui-ready/preview"
            for spec in $SCENES; do
              local name=${spec%%:*} wait_s=${spec##*:} n=0
              xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
              rm -f "$ready"
              xcrun simctl launch "$dev" "$BUNDLE_ID" -uiPreview "$name" -uiDemo zh-TW ${1+"$@"} >/dev/null || { echo "::warning::$prefix$name を開けませんでした"; continue; }
              while [ ! -f "$ready" ] && [ $n -lt 80 ]; do sleep 0.25; n=$((n + 1)); done
              [ -f "$ready" ] || echo "::warning::$prefix$name の画面が出るのを待ちきれませんでした"
              sleep "$wait_s"
              xcrun simctl io "$dev" screenshot "$OUT/${prefix}${name}.png" >/dev/null 2>&1 || echo "::warning::$prefix$name を撮れませんでした"
            done
            xcrun simctl terminate "$dev" "$BUNDLE_ID" 2>/dev/null || true
          }
          # (1) いつものシミュレーターで、大きな文字
          shoot "$UDID" "axl-" $AXL
          # (2) 小さな iPhone: 無ければ作る。メモリを空けるため、いつものシミュレーターは止める。
          SMALL=$(python3 - <<'PY'
          import json, re, subprocess
          def sim(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
          runtimes = [r for r in sim("runtimes")["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          runtimes.sort(key=lambda r: [int(x) for x in re.findall(r"\d+", r.get("version", "0"))], reverse=True)
          def rank(name):
              if name == "iPhone SE (3rd generation)": return 0
              if "SE" in name: return 1
              if "mini" in name: return 2
              if re.search(r"\d+e\b", name): return 3            # iPhone 16e
              if not re.search(r"Pro|Plus|Max|Air", name): return 4
              return 9
          devices = sim("devices", "available")["devices"]
          for rt in runtimes:
              phones = [t for t in rt.get("supportedDeviceTypes", []) if t.get("name", "").startswith("iPhone")]
              if not phones:
                  continue
              best = min(phones, key=lambda t: rank(t["name"]))
              have = [d for d in devices.get(rt["identifier"], []) if d.get("deviceTypeIdentifier") == best["identifier"]]
              if have:
                  print(have[0]["udid"], best["name"], sep="\t"); break
              try:
                  udid = subprocess.check_output(["xcrun", "simctl", "create", "CW Small", best["identifier"], rt["identifier"]]).decode().strip()
                  print(udid, best["name"], sep="\t"); break
              except subprocess.CalledProcessError:
                  continue
          PY
          ) || SMALL=""
          SMALL_UDID=$(printf '%s' "$SMALL" | cut -f1); SMALL_NAME=$(printf '%s' "$SMALL" | cut -f2)
          if [ -z "$SMALL_UDID" ]; then
            echo "::warning::小さな iPhone のシミュレーターが見つかりませんでした（小さな画面の写真は無し）"
            exit 0
          fi
          echo "small simulator: $SMALL_NAME ($SMALL_UDID)"
          echo "$SMALL_NAME" > "$OUT/small-device.txt"
          if [ "$SMALL_UDID" != "$UDID" ]; then
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl boot "$SMALL_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$SMALL_UDID" -b >/dev/null || { echo "::warning::小さな iPhone が起動しませんでした"; exit 0; }
            xcrun simctl install "$SMALL_UDID" "$APP" || { echo "::warning::小さな iPhone に入れられませんでした"; exit 0; }
          fi
          shoot "$SMALL_UDID" "small-"
          shoot "$SMALL_UDID" "small-axl-" $AXL
          ls -la "$OUT" | grep -E "axl-|small-" || true

      - name: 見本の画面を ci-previews ブランチに置く（Claude が読める場所）
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/report"
          [ -d "$SRC" ] || exit 0
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')"
          # 切り抜きの確認も同じ枝に置くので、押し出しがぶつかったら ci-previews を浅く取り直して置き直す。
          publish() {
            DEST="$RUNNER_TEMP/previews-branch-$1"
            rm -rf "$DEST"
            # この実行の場所だけを取り出す（ほかの実行の画像は取らない）。枝をまるごと浅く取ると 5〜30 分かかった（10/16）。
            git clone --quiet --depth 1 --filter=blob:none --no-checkout --branch ci-previews "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DEST" || return 1
            cd "$DEST"
            git sparse-checkout set --no-cone "/$DIR/" || return 1
            git checkout --quiet ci-previews || return 1
            rm -rf "$DIR" && mkdir -p "$DIR"
            cp "$SRC"/*.png "$DIR"/ 2>/dev/null || true
            [ -d "$SRC/previews" ] && cp "$SRC"/previews/*.png "$DIR"/ 2>/dev/null || true
            [ -d "$SRC/previews" ] && cp "$SRC"/previews/*.txt "$DIR"/ 2>/dev/null || true
            # 「作り直す」の動き（-uiPreview regen の録画）
            [ -f "$SRC/videos/scan-regen.mp4" ] && cp "$SRC/videos/scan-regen.mp4" "$DIR/regen.mp4" || true
            # キャッチの演出の録画（お手本の動画と比べる）
            for v in "$SRC"/videos/catch-*.mp4 "$SRC"/videos/scan-analyzing.mp4; do [ -f "$v" ] && cp "$v" "$DIR/" ; done
            echo "${{ github.sha }}" > "$DIR/COMMIT"
            git add -A
            git -c user.name="ios-check" -c user.email="ios-check@users.noreply.github.com" commit --quiet -m "previews for $HEAD_REF @ ${{ github.sha }}" || return 0
            git push --quiet origin ci-previews
          }
          for i in 1 2 3; do
            ( publish "$i" ) && exit 0
            sleep $((i * 5))
          done
          echo "::warning::ci-previews に置けませんでした"

      - name: 結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check-report
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

  # TestFlight は Release で組み立てる。Debug だけの名前（#if DEBUG の中のもの）を外で使うと Release だけ壊れる
  # （1.0.1 (1036) の前に一度起きた）。シミュレーター向けに Release で組み立てて、それを先に見つける。署名はしない。
  release-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Release で組み立てる（TestFlight と同じ設定。署名なし）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CatchWords.xcodeproj \
            -target CatchWords \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            | tee "$RUNNER_TEMP/release.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/release.log" || { grep -E "error:" "$RUNNER_TEMP/release.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; echo "::error::Release で組み立てられませんでした（Debug だけの名前を #if DEBUG の外で使っていないか）"; exit 1; }

  # 切り抜きの確認（docs/cutout-failure-modes.md）: アプリの切り抜きのコード（CatchPlan など）をそのまま Mac 用に
  # 組み立て、本物の Vision で本物の写真を切り抜く。わざと小さい・ずれた箱も含む。前（1.0.1 より前の計画）と今を
  # 並べた画像を ci-previews の runs/<ブランチ>-cutout/ に置く。物の 85% 未満しか入らない・箱の線でまっすぐ切れる・
  # 四角い・ほかの物が混ざる、のどれかがあれば失敗。
  cutout-harness:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 切り抜きの確認を組み立てる（アプリと同じファイル）
        run: |
          set -o pipefail
          swiftc -O \
            ios/CatchWords/Models/CatchPlan.swift \
            ios/CatchWords/Models/CatchGeometry.swift \
            ios/CatchWords/Models/TagPlacement.swift \
            ios/CatchWords/Services/InstanceMasks.swift \
            scripts/cutout-harness/OldCatchPlan.swift \
            scripts/cutout-harness/main.swift \
            -o "$RUNNER_TEMP/cutout-harness" 2>&1 | tee "$RUNNER_TEMP/harness-build.log" || {
              grep -E "error:" "$RUNNER_TEMP/harness-build.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l#"$GITHUB_WORKSPACE/"}"; done; exit 1; }
      - name: 本物の写真を本物の Vision で切り抜く
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cutout"
          sw_vers
          "$RUNNER_TEMP/cutout-harness" scripts/cutout-harness/cases.json "$RUNNER_TEMP/cutout" | tee "$RUNNER_TEMP/cutout/log.txt"
      - name: 結果を ci-previews に置く
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/cutout"
          [ -d "$SRC" ] || exit 0
          [ -f "$SRC/summary.md" ] && cat "$SRC/summary.md" >> "$GITHUB_STEP_SUMMARY"
          DIR="runs/$(echo "$HEAD_REF" | tr '/' '_')-cutout"
          publish() {
            DEST="$RUNNER_TEMP/previews-branch-$1"
            rm -rf "$DEST"
            # この実行の場所だけを取り出す（ほかの実行の画像は取らない）。枝をまるごと浅く取ると 5〜30 分かかった（10/16）。
            git clone --quiet --depth 1 --filter=blob:none --no-checkout --branch ci-previews "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DEST" || return 1
            cd "$DEST"
            git sparse-checkout set --no-cone "/$DIR/" || return 1
            git checkout --quiet ci-previews || return 1
            rm -rf "$DIR" && mkdir -p "$DIR"
            cp "$SRC"/* "$DIR"/ 2>/dev/null || true
            echo "${{ github.sha }}" > "$DIR/COMMIT"
            git add -A
            git -c user.name="ios-check" -c user.email="ios-check@users.noreply.github.com" commit --quiet -m "cut-out harness for $HEAD_REF @ ${{ github.sha }}" || return 0
            git push --quiet origin ci-previews
          }
          for i in 1 2 3; do
            ( publish "$i" ) && exit 0
            sleep $((i * 5))
          done
          echo "::warning::ci-previews に置けませんでした"

