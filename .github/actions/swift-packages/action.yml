# Swift の部品（Sentry・Google の広告）を、組み立ての前に取り込む。
#
# なぜ: 部品のうち Sentry は GitHub のリリースに置かれた zip で、組み立てのたびに 7 つ取りに行く。2026-11-08 には GitHub の
# リリースの取り出しが 1 時間以上 504（時間切れ）を返し続け、1 つでも落ちると組み立ての前で全部のチェックと TestFlight への
# 送信が止まった。
# 何をするか:
#   1. 前に取れた部品を GitHub の保存場所（actions/cache）から戻す。戻れば取りに行かない。
#   2. 取り込みを、取れるまで何度もやり直す（504 の時だけ。待ちは少しずつ長く、全部で 40 分まで）。
#   3. 全部取れたら保存する（次の実行は 1 で済む）。
name: Swift の部品を取り込む
description: Resolve the Swift packages before building, retrying GitHub's release download 504s, with a cache.
runs:
  using: composite
  steps:
    - name: Xcode の版を鍵にする
      id: key
      shell: bash
      run: |
        XC=$(xcodebuild -version | tr -d '\n' | shasum | cut -c1-12)
        PROJ=$(shasum ios/CatchWords.xcodeproj/project.pbxproj | cut -c1-12)
        echo "key=spm-v1-${RUNNER_OS}-${RUNNER_ARCH}-${XC}-${PROJ}" >> "$GITHUB_OUTPUT"
        echo "prefix=spm-v1-${RUNNER_OS}-${RUNNER_ARCH}-${XC}-" >> "$GITHUB_OUTPUT"

    - name: 前に取れた部品を戻す
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/CatchWords-*/SourcePackages
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: 部品を取り込む（504 の時はやり直す）
      id: resolve
      shell: bash
      working-directory: ios
      run: |
        set -uo pipefail
        start=$(date +%s)
        for attempt in $(seq 1 30); do
          if xcodebuild -resolvePackageDependencies -project CatchWords.xcodeproj -scheme CatchWords > "$RUNNER_TEMP/resolve.log" 2>&1; then
            echo "部品の取り込み: ${attempt} 回目で完了"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed=$(grep -c "failed downloading" "$RUNNER_TEMP/resolve.log" || true)
          grep -E "error:|failed downloading" "$RUNNER_TEMP/resolve.log" | sed 's/which is required.*//' | head -10
          if ! grep -qE "badResponseStatusCode\((5[0-9][0-9]|429)\)|timed out|network connection was lost" "$RUNNER_TEMP/resolve.log"; then
            echo "::error::部品の取り込みに失敗しました（GitHub の時間切れではない）"; tail -40 "$RUNNER_TEMP/resolve.log"; exit 1
          fi
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -gt 2400 ]; then
            echo "::error::GitHub のリリースの取り出しが 40 分たっても時間切れ（504）のまま。GitHub 側の障害です"; exit 1
          fi
          wait=$(( attempt < 6 ? attempt * 15 : 90 ))
          echo "::warning::${attempt} 回目: ${failed} 個が GitHub の時間切れで取れず。${wait} 秒後にやり直します"
          sleep "$wait"
        done
        echo "::error::部品を取り込めませんでした"; exit 1

    - name: 取れた部品を保存する
      if: steps.resolve.outputs.ok == '1' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/CatchWords-*/SourcePackages
        key: ${{ steps.key.outputs.key }}
