<!--

    v10（docs/design/catch-concepts の O10）: シャッター → 枠がカチッ → 光のペンが輪郭を描く → 名前が届くとペンが追いつく → タグ
    v6（同じく F）: タグを押す → 写真が白くとけ、物がステッカーになって浮かぶ → ことばと読み → 「新しいことばをキャッチ！」
                     → 図鑑の飲み物の枠に入る
  値・見た目はアプリの演出のコード（film/js/o10_pen.js・concepts6.js・core6.js・dex.js）から。画面が横長なので配置だけ変えた。
  ?lang=ja|en で画面の文字の言語を切り替える（1 本に 1 つの言語。中国語は学ぶ単語だけ）。?f=<コマ> でそのコマを描く。

<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('fonts/Inter-500.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/Inter-600.ttf'); }

</style>
<canvas id="c" width="3840" height="1646"></canvas>
<script>
const W = 3840, H = 1646, FPS = 30, DUR = 12, N = DUR * FPS;          // the layout space: the 21:9 header
const q = new URLSearchParams(location.search), LANG = q.get('lang') || 'ja';
// ?fmt=search: the search results asset (3:2, 2880×1920). The same layout, cut from its middle (x 686–3155, the
// cup, the scooter and the chalkboard) and drawn 1.17× larger, so the tags and words read bigger in the small card.
const FMT = q.get('fmt') === 'search' ? { cw: 2880, ch: 1920, x0: 686 } : { cw: W, ch: H, x0: 0 };
FMT.k = FMT.ch / H;
// 画面の文字（アプリの strings.json の訳と同じ）。タグの意味・ことばの意味もこの言語
const L = {
  ja: { scan: '写真をスキャンしています', tap: '覚えたいことばをタップ', caught: '新しいことばをキャッチ！', cat: '飲み物',
        no1: 'No.001 · 飲み物', mean: { cup: 'タピオカミルクティー', scooter: 'バイク', sign: '黒板' }, word: 'タピオカミルクティー', font: '"Noto Sans JP"' },
  en: { scan: 'Scanning the photo', tap: 'Tap a word to learn', caught: 'New word caught!', cat: 'Drinks',
        no1: 'No.001 · Drinks', mean: { cup: 'bubble milk tea', scooter: 'scooter', sign: 'blackboard' }, word: 'bubble milk tea', font: 'Inter' },
}[LANG];
const ZH = { cup: '珍珠奶茶', scooter: '機車', sign: '黑板' };
const FONT_TC = '"Noto Sans TC", "Noto Sans JP", sans-serif', FONT_UI = 'Inter, "Noto Sans JP", sans-serif';
const BLUE = '#0083FF', BLUE2 = '#2A9BFF', INK = '#0B121A', MUTED = '#5C646F', BG_APP = '#F9FCFF', LOCKED = '#6CC8FF';
const PT = 2.0;                                           // アプリの 1px（1080 幅の画面）→ この絵

const c = document.getElementById('c'); c.width = FMT.cw; c.height = FMT.ch; const ctx = c.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - (1 - x) ** 3, inCubic: x => x ** 3, inOutCubic: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2, outBack: (x, s = 1.7) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
};
function bezierEase(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; } return Y(clamp(t)); };
}
const mv = bezierEase(.3, 1.3, .5, 1), cssEase = bezierEase(.25, .1, .25, 1);
// a damped spring 0 → 1 (the app's .spring)
const sp = (t, t0, dur, damp = .75) => { if (t <= t0) return 0; const u = (t - t0) / dur; return 1 - Math.exp(-6 * damp * u) * Math.cos(6 * Math.sqrt(1 - damp * damp) * u * 1.2); };
const bez2 = (a, b, c2, u) => [0, 1].map(i => (1 - u) ** 2 * a[i] + 2 * (1 - u) * u * b[i] + u * u * c2[i]);
const rr = (x, y, w, h, r, g = ctx) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const font = (w, s, f, g = ctx) => g.font = `${w} ${s}px ${f}`;
function text(s, x, y, { w = 500, size = 40, f = L.font, color = INK, align = 'center', alpha = 1, ls = 0, g = ctx } = {}) {
  if (alpha <= 0) return; g.save(); g.globalAlpha *= alpha; font(w, size, f, g); g.fillStyle = color; g.textAlign = align;
  if (ls) g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
const measure = (s, w, size, f = L.font, ls = 0) => { ctx.save(); font(w, size, f); if (ls) ctx.letterSpacing = ls + 'px'; const m = ctx.measureText(s).width; ctx.restore(); return m; };

// ---------- zhuyin (the app: the reading stands to the right of each character, tone mark beside it) ----------
function Z(h, zy) {
  const parts = zy.split(' '), out = [];
  [...h].forEach((ch, i) => {
    let s = parts[i] || '', tone = '', neutral = false;
    if (s.startsWith('˙')) { neutral = true; s = s.slice(1); }
    const last = s.slice(-1); if ('ˊˇˋ'.includes(last)) { tone = last; s = s.slice(0, -1); }
    out.push({ h: ch, z: s, tone, neutral });
  });
  return out;
}
const zyCell = size => { const zs = size * .31; return { zs, cell: size + zs * 1.2 }; };
const zyWidth = (units, size) => { const { zs, cell } = zyCell(size); return units.length * cell - zs * .2; };
function zyChar(u, cx, y, size, { color = INK, zcolor = MUTED, w = 800 } = {}) {
  const { zs } = zyCell(size);
  text(u.h, cx + size / 2, y, { w, size, f: FONT_TC, color });
  if (!u.z) return;
  const zx = cx + size + zs * .62, n = [...u.z].length, top = y - size * .42 - (n * zs * 1.02) / 2;
  [...u.z].forEach((z, j) => text(z, zx, top + (j + 1) * zs * 1.02, { w: 500, size: zs, f: FONT_TC, color: zcolor }));
  if (u.tone) text(u.tone, zx + zs * .62, top + zs * 1.02 * (n - .35), { w: 700, size: zs * .9, f: FONT_TC, color: zcolor });
  if (u.neutral) text('˙', zx, top - zs * .05, { w: 700, size: zs * .9, f: FONT_TC, color: zcolor });
}
function zyDraw(units, x, y, size, opts = {}) {
  const { cell } = zyCell(size); let cx = x - zyWidth(units, size) / 2;
  units.forEach(u => { zyChar(u, cx, y, size, opts); cx += cell; });
}
const PICK = { h: '珍珠奶茶', u: Z('珍珠奶茶', 'ㄓㄣ ㄓㄨ ㄋㄞˇ ㄔㄚˊ') };   // the word caught (owner 2026-10-23: 珍珠奶茶, not 珍奶)

// ---------- assets ----------
const A = {}; let O = null;
const loadImg = src => new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ng(src); i.src = src; });

// ---------- times (seconds). v10's values from the shutter; v6's after the tap ----------
const T_CAP = .8, T_NAMES = T_CAP + 2.4;
const ORDER = ['cup', 'scooter', 'sign'];
const BR_IN = T_CAP + .26, IN = .26, MOVE = .54, PEN = { cup: 1.0, scooter: .9, sign: .6 }, HOP = .26;
const LOCK = []; { let t = BR_IN + IN + MOVE; ORDER.forEach((k, r) => { LOCK[r] = t; t += PEN[k] + HOP; }); }
const CLOSE = r => LOCK[r] + PEN[ORDER[r]], DRAW_END = () => CLOSE(ORDER.length - 1), MOVE0 = r => LOCK[r] - MOVE;
// v10 ⑧: when the names arrive the pen speeds up to finish what is left within 0.5 s (≤ 4×), on its own clock τ
const CATCH = .5, RAMP = .15, KMAX = 4, LEFT = DRAW_END() - T_NAMES;
const K = LEFT <= CATCH ? 1 : Math.min(KMAX, 1 + (LEFT - CATCH) / (CATCH - RAMP / 2));

const tau = t => (K === 1 || t <= T_NAMES ? t : t + (K - 1) * extra(t - T_NAMES));
const real = x => { if (K === 1 || x <= T_NAMES) return x; let lo = T_NAMES, hi = x; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (tau(m) < x) lo = m; else hi = m; } return hi; };
const CLOSE_R = r => real(CLOSE(r)), DRAW_END_R = () => real(DRAW_END());
const FOUND = Math.max(T_NAMES, CLOSE_R(0));
const TAG = k => Math.max(FOUND + .14 + .13 * k, CLOSE_R(k) + .1);
const T_TAP = TAG(ORDER.length - 1) + .95;
// v6 (concepts6.js getTimes, without the choice list: the header goes straight from the tap to the word)
const C = T_TAP + .22, CUT = C + .9, G = C + 1.25, CH = [G + .04, G + .23, G + .42, G + .61], MEAN = C + 1.95, CATCHT = C + 2.1;
const D0 = CATCHT + 1.75, LAUNCH = D0 + .5, ARRIVE = D0 + .92, BACK = ARRIVE + 1.45, END = BACK + .85;

// ---------- the camera: a slow push towards the cup; back to 1 at the end so the loop closes ----------
let FOC = [0, 0];
function cam(t) {
  const push = .035 * E.inOutSine(seg(t, 0, C)), melt = .07 * E.inOutCubic(seg(t, C + .05, C + .6));
  const back = E.inOutCubic(seg(t, BACK, END));
  return 1 + (push + melt) * (1 - back);
}
const toS = (t, x, y) => { const s = cam(t); return [FOC[0] + (x - FOC[0]) * s, FOC[1] + (y - FOC[1]) * s]; };

// the photo, blurred and whitened as the app's backdrop takes over (v6 dGet: blur 40, brightness, BG_APP + a blue pool)
const SMALL = document.createElement('canvas'); SMALL.width = 960; SMALL.height = 412;
function photo(t, melt) {
  const s = cam(t);
  ctx.save(); ctx.translate(FOC[0], FOC[1]); ctx.scale(s, s); ctx.translate(-FOC[0], -FOC[1]);
  if (melt <= .01) ctx.drawImage(A.photo, 0, 0, W, H);
  else { ctx.filter = `blur(${40 * melt / 4}px) brightness(${1 + .06 * melt})`; ctx.drawImage(SMALL, -20, -20, W + 40, H + 40); ctx.filter = 'none'; }
  ctx.restore();
}
function appBackdrop(melt, sx, sy) {
  if (melt <= 0) return;
  ctx.save(); ctx.globalAlpha = melt; ctx.fillStyle = BG_APP; ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(sx, sy + 40, 0, sx, sy + 40, 1100);
  r.addColorStop(0, 'rgba(221,238,255,0.95)'); r.addColorStop(.35, 'rgba(228,241,255,0.7)'); r.addColorStop(.7, 'rgba(240,247,255,0.3)'); r.addColorStop(1, 'rgba(249,252,255,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------- v10: the screen edge glows from the shutter until the names are in ----------
function edgeGlow(t) {
  const a = E.outCubic(seg(t, T_CAP, T_CAP + .3)) * (1 - seg(t, FOUND + .2, FOUND + .7)); if (a <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a * (.75 + .25 * Math.sin(t * 3.2));
  for (const [w, al] of [[90, .22], [36, .35], [10, .8]]) {
    ctx.strokeStyle = `rgba(80,170,255,${al})`; ctx.lineWidth = w; ctx.filter = `blur(${w / 2}px)`; ctx.strokeRect(0, 0, FMT.cw, FMT.ch);
  }
  ctx.restore();
}
function flash(t) { const a = .75 * seg(t, T_CAP - .04, T_CAP) * (1 - seg(t, T_CAP, T_CAP + .28)); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); } }

// ---------- the top pill (the app's: glass capsule, sparkles icon, label) ----------
function sparkles(x, y, r, color) {
  const star = (cx, cy, s) => { ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.quadraticCurveTo(cx + s * .15, cy - s * .15, cx + s, cy); ctx.quadraticCurveTo(cx + s * .15, cy + s * .15, cx, cy + s); ctx.quadraticCurveTo(cx - s * .15, cy + s * .15, cx - s, cy); ctx.quadraticCurveTo(cx - s * .15, cy - s * .15, cx, cy - s); ctx.fill(); };
  ctx.fillStyle = color; star(x - r * .15, y + r * .1, r * .62); star(x + r * .5, y - r * .45, r * .32);
}
function pill(t) {
  const a = E.outCubic(seg(t, T_CAP + .15, T_CAP + .45)) * (1 - seg(t, C, C + .2)); if (a <= 0) return;
  const swap = seg(t, TAG(ORDER.length - 1) + .2, TAG(ORDER.length - 1) + .5), label = swap < .5 ? L.scan : L.tap;
  const ta = swap < .5 ? 1 - swap * 2 : swap * 2 - 1, size = 30 * PT, w = measure(label, 600, size) + 100 * PT, h = 64 * PT, x = W / 2 - w / 2, y = 520;
  ctx.save(); ctx.globalAlpha = a;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 10; rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.86)'; ctx.fill(); ctx.restore();
  rr(x + 1, y + 1, w - 2, h - 2, h / 2 - 1); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.stroke();
  ctx.globalAlpha *= ta; sparkles(x + 44 * PT, y + h / 2, 17 * PT, BLUE2);
  // the scanning label shimmers (the app's), the tap label is still
  text(label, x + 64 * PT + (w - 64 * PT - 36 * PT) / 2, y + h / 2 + size * .36, { w: 600, size, color: INK });
  ctx.restore();
}

// ---------- v10: the bracket ----------
const FULL = [760, 400, 3080, 1480];
function boxOf(k) { const [x0, y0, x1, y1] = O[k].box, p = 14 * PT; return [x0 - p, y0 - p, x1 + p, y1 + p]; }
function corner(x, y, sx, sy, arm, r) { ctx.moveTo(x, y + sy * arm); ctx.lineTo(x, y + sy * r); ctx.arcTo(x, y, x + sx * r, y, r); ctx.lineTo(x + sx * arm, y); }
function bracket(rt) {
  const t = tau(rt); if (t < BR_IN) return;
  const a = mv(seg(t, BR_IN, BR_IN + IN)) * (1 - seg(rt, DRAW_END_R(), DRAW_END_R() + .3)); if (a <= 0) return;
  let r = -1; ORDER.forEach((_, i) => { if (t >= MOVE0(i)) r = i; });
  const to = r < 0 ? FULL : boxOf(ORDER[r]), from = r <= 0 ? FULL : boxOf(ORDER[r - 1]);
  const u = r < 0 ? 1 : mv(seg(t, MOVE0(r), MOVE0(r) + MOVE)), locked = r >= 0 && t >= LOCK[r];
  let R = to.map((v, j) => lerp(from[j], v, u)); const p0 = toS(rt, R[0], R[1]), p1 = toS(rt, R[2], R[3]); R = [...p0, ...p1];
  const sq = locked ? 1 - .06 * (1 - Math.abs(1 - 2 * seg(t, LOCK[r], LOCK[r] + .26))) : 1, cx = (R[0] + R[2]) / 2, cy = (R[1] + R[3]) / 2;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(sq, sq); ctx.translate(-cx, -cy);
  ctx.lineWidth = 3 * PT; ctx.lineJoin = 'round'; ctx.strokeStyle = locked ? LOCKED : '#fff'; ctx.shadowColor = 'rgba(100,224,255,0.9)'; ctx.shadowBlur = 6 * PT;
  const arm = 22 * PT, rad = 12 * PT;
  ctx.beginPath(); corner(R[0], R[1], 1, 1, arm, rad); corner(R[2], R[1], -1, 1, arm, rad); corner(R[0], R[3], 1, -1, arm, rad); corner(R[2], R[3], -1, -1, arm, rad); ctx.stroke();
  ctx.restore();
}

// ---------- v10: the pen (W2: a big point of light draws each outline in one stroke, slower where it turns) ----------
const TD = {};
function tdOf(r) {
  if (TD[r]) return TD[r];
  const o = O[ORDER[r]], n = o.pts.length;
  const w = o.turn.map((_, i) => { let s = 0; for (let d = -4; d <= 4; d++) s += o.turn[(i + d + n) % n]; return 1 + 2.6 * s / 9; });
  let acc = 0; const T = w.map(x => (acc += x)), tot = acc;
  return TD[r] = T.map(x => LOCK[r] + PEN[ORDER[r]] * Math.acos(1 - 2 * Math.min(1, x / tot)) / Math.PI);
}
function headOf(r, t) {
  const o = O[ORDER[r]], n = o.pts.length, td = tdOf(r);
  if (t <= LOCK[r]) return { h: 0, xy: o.pts[0] };
  if (t >= CLOSE(r)) return { h: n, xy: o.pts[0] };
  let lo = 0, hi = n - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (td[m] <= t) lo = m; else hi = m - 1; }
  const t0 = td[lo], t1 = td[Math.min(n - 1, lo + 1)], f = t1 > t0 ? clamp((t - t0) / (t1 - t0)) : 0, p = o.pts[lo], q2 = o.pts[(lo + 1) % n];
  return { h: lo + f, xy: [lerp(p[0], q2[0], f), lerp(p[1], q2[1], f)] };
}
const hopArc = (a, b) => [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 220];
function penAt(rt) {
  const t = tau(rt);
  for (let r = 0; r < ORDER.length; r++) {
    if (t >= LOCK[r] && t < CLOSE(r)) return { xy: headOf(r, t).xy, a: 1 };
    if (r < ORDER.length - 1 && t >= CLOSE(r) && t < LOCK[r + 1]) { const a = O[ORDER[r]].pts[0], b = O[ORDER[r + 1]].pts[0]; return { xy: bez2(a, hopArc(a, b), b, E.inOutSine(seg(t, CLOSE(r), LOCK[r + 1]))), a: .55 }; }
  }
  if (rt >= DRAW_END_R() && rt < DRAW_END_R() + .25) return { xy: O[ORDER[ORDER.length - 1]].pts[0], a: 1 - seg(rt, DRAW_END_R(), DRAW_END_R() + .25) };
  return null;
}
function glowDot(x, y, r, a, rgb = '160,215,255') {
  if (a <= .01) return; ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.28, `rgba(${rgb},${.6 * a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
const OL = document.createElement('canvas'); OL.width = W; OL.height = H; const olx = OL.getContext('2d');
function outlines(t) {
  const tp = tau(t); let A0 = 1;
  if (t > FOUND) { const p = ((t - FOUND) % 2) / 2; A0 = p < .5 ? lerp(1, .5, E.inOutSine(p * 2)) : lerp(.5, 1, E.inOutSine(p * 2 - 1)); }
  A0 *= 1 - cssEase(seg(t, T_TAP, T_TAP + .5)); if (A0 <= .005) return;
  olx.clearRect(0, 0, W, H); let any = false;
  ORDER.forEach((k, r) => {
    if (tp < LOCK[r]) return; any = true;
    const o = O[k], n = o.pts.length, h = headOf(r, tp).h, last = Math.min(n, Math.floor(h));
    olx.beginPath();
    for (let i = 0; i <= last; i++) { const p = toS(t, ...o.pts[i % n]); i ? olx.lineTo(p[0], p[1]) : olx.moveTo(p[0], p[1]); }
    if (h < n) { const f = h - last, a = o.pts[last % n], b = o.pts[(last + 1) % n], p = toS(t, lerp(a[0], b[0], f), lerp(a[1], b[1], f)); olx.lineTo(p[0], p[1]); }
    const [x0, y0, x1, y1] = o.box, g = olx.createLinearGradient(...toS(t, x0, y0), ...toS(t, x1, y1));
    g.addColorStop(0, '#BFE8FF'); g.addColorStop(.5, '#9CC8FF'); g.addColorStop(1, '#CFE3FF');
    olx.lineWidth = 2.2 * PT; olx.lineJoin = olx.lineCap = 'round'; olx.strokeStyle = g; olx.stroke();
  });

  ctx.save(); ctx.globalAlpha = A0; ctx.filter = `drop-shadow(0 0 ${5 * PT}px rgba(140,200,255,0.95)) drop-shadow(0 0 ${16 * PT}px rgba(40,120,255,0.6))`;
  ctx.drawImage(OL, 0, 0); ctx.restore();
}

// ---------- the tags (the app's: white glass capsule, blue dot + the word, the meaning under it, NEW) ----------
function tagGeom(k) {
  const size = 46 * PT, dot = 13 * PT, w1 = measure(ZH[k], 800, size, FONT_TC) + dot * 2 + 14 * PT, w2 = measure(L.mean[k], 500, 28 * PT);
